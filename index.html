<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle Scorekeeper</title>
<style>
  :root {
    --bg-main: #0f2027;
    --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    --panel-bg: rgba(30, 42, 56, 0.85);
    --sidebar-bg: #0b161c;
    --btn-show: #00e676;
    --btn-fc: #ff5252;
    --btn-drop: #ff9800;
    --btn-md: #ffc107;
    --btn-out: #9c27b0;
    --text-light: #ffffff;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Layout Structure */
  .app-wrapper {
    display: flex;
    flex-direction: row;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* Sidebar */
  .left-sidebar {
    width: 170px;
    background: var(--sidebar-bg);
    padding: 15px;
    border-right: 2px solid #334;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  .content-area {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .main-pane {
    flex: 2;
    padding: 30px;
    overflow-y: auto;
  }

  .rhs-pane {
    flex: 1;
    min-width: 350px;
    background: var(--panel-bg);
    padding: 20px;
    border-left: 2px solid #334;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* Typography & Elements */
  h1, h2, h3, h4 { margin-top: 0; }
  
  .bigInput {
    width: 100%;
    padding: 15px;
    margin-bottom: 10px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #445;
    background: #111;
    color: white;
    box-sizing: border-box;
  }

  /* Manual Input */
  .manual-input {
    width: 85px;
    padding: 10px;
    margin: 4px;
    border-radius: 8px;
    border: 1px solid #445;
    background: #111;
    color: white;
    font-size: 16px;
    text-align: center;
  }

  .manual-input::-webkit-outer-spin-button,
  .manual-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  button {
    padding: 12px 16px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #111;
    transition: transform 0.1s, opacity 0.2s;
  }

  button:hover:not(:disabled) { transform: scale(1.05); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  .navBtn { width: 100%; margin-bottom: 15px; background: #34495e; color: white; padding: 15px; font-size: 16px;}
  .navBtn.active-nav { background: #3498db; outline: 2px solid white; }
  .bigBtn { width: 100%; margin: 10px 0; font-size: 20px; padding: 18px; color: white; background: #3498db; }
  .actionBtn { width: auto; color: #111; }
  .timeBtn { background: #445; color: white; font-size: 14px; padding: 15px 12px; margin-bottom: 10px; border-radius: 8px; white-space: nowrap;}
  
  .deleteBtn { background: #ff5252; color: white; }
  .resumeBtn { background: #00e676; color: #111; }

  /* Action Buttons */
  .show { background: var(--btn-show); }
  .fc { background: var(--btn-fc); }
  .drop { background: var(--btn-drop); }
  .md { background: var(--btn-md); }
  .out { background: var(--btn-out); color: white;}
  .util { background: #607d8b; color: white; }

  button.active { outline: 4px solid white; box-shadow: 0 0 10px white;}

  /* Player States */
  .eliminated { opacity: 0.4; text-decoration: line-through; background: rgba(255,0,0,0.1); }
  .locked { opacity: 0.5; }
  .dealer-row td { border-bottom: 3px solid #00e676; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden;}
  td, th { padding: 15px; text-align: center; border-bottom: 1px solid #334; font-size: 18px;}
  th { background: #111; color: #aaa; }

  /* Utilities */
  .dealer-badge { background: #00e676; color: #111; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; margin-left: 10px;}
  .reentry-badge { color: #ffc107; font-size: 12px; font-weight: bold; margin-top: 4px; display: inline-block;}
  .flex-row { display: flex; justify-content: space-between; align-items: center; }
  
  .game-card { background: rgba(0,0,0,0.3); border: 1px solid #445; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}

  /* Footer Styling */
  .app-footer {
    margin-top: auto; /* Pushes the footer to the bottom of the sidebar */
    text-align: center;
    font-size: 11px;
    color: #666;
    line-height: 1.5;
    padding-top: 20px;
  }

  /* Mobile responsiveness */
  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow: auto; height: auto;}
    .left-sidebar { width: auto; flex-direction: row; flex-wrap: wrap; justify-content: space-around; border-right: none; border-bottom: 2px solid #334; padding: 10px; }
    .navBtn { margin-bottom: 0; margin-right: 10px; flex: 1; }
    .content-area { flex-direction: column; overflow: visible;}
    .rhs-pane { border-left: none; border-top: 2px solid #334; }
    .app-footer { width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid #334;}
  }
</style>
</head>
<body>

<div class="app-wrapper">
  <!-- Left Navigation Sidebar -->
  <div class="left-sidebar">
    <div>
      <h2 style="color:#00e676; margin-bottom: 30px; text-align:center;">Elite Rummy Circle</h2>
      <button id="navNewGame" class="navBtn active-nav" onclick="showNewGameScreen()">New Game</button>
      <button id="navContinue" class="navBtn" onclick="showContinueScreen()">Continue Game</button>
    </div>
    
    <!-- Branding Footer -->
    <div class="app-footer">
      Developers Elite IT Copyright 2026<br>
      App version: Version 6- May 2026 release
    </div>
  </div>

  <!-- Content Area -->
  <div class="content-area">
    <div class="main-pane" id="mainPane"></div>
    <div class="rhs-pane" id="rhsPane" style="display: none;"></div>
  </div>
</div>

<script>
/* Global App Data */
const STORAGE_KEY = 'greensRummySavedGames'; 
let savedGames = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let state = null; // Represents the currently loaded game
let historyStack = []; // Resets on game load

/* DOM Elements */
const mainPane = document.getElementById('mainPane');
const rhsPane = document.getElementById('rhsPane');
const navNewGame = document.getElementById('navNewGame');
const navContinue = document.getElementById('navContinue');

/* --- LOCAL STORAGE MANAGEMENT --- */
function persistData() {
  if (state && state.id) {
    const index = savedGames.findIndex(g => g.id === state.id);
    if (index !== -1) {
      savedGames[index] = state;
    } else {
      savedGames.push(state);
    }
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedGames));
}

function deleteGame(id) {
  if(confirm("Are you sure you want to delete this game permanently?")) {
    savedGames = savedGames.filter(g => g.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedGames));
    if(state && state.id === id) {
      state = null; 
    }
    showContinueScreen();
  }
}

/* --- HELPER FUNCTIONS --- */
function appendTime(inputId) {
  let input = document.getElementById(inputId);
  if (!input) return;
  
  let now = new Date();
  let timeString = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  if (input.value.trim() !== "") {
    input.value = input.value.trim() + " - " + timeString;
  } else {
    input.value = timeString;
  }
}

function getReentryScore() {
  let activeScores = Object.keys(state.totals)
    .filter(p => !state.eliminated[p])
    .map(p => state.totals[p])
    .sort((a, b) => b - a);

  if (activeScores.length === 0) return 0; 
  let maxScore = activeScores[0];
  
  if (maxScore >= 239 && activeScores.length > 1) {
    return activeScores[1] + 1; 
  }
  return maxScore + 1;
}

function setNavActive(buttonId) {
  navNewGame.classList.remove('active-nav');
  navContinue.classList.remove('active-nav');
  if(buttonId) document.getElementById(buttonId).classList.add('active-nav');
}

/* --- 1. SCREENS --- */

/* NEW GAME SCREEN */
function showNewGameScreen() {
  setNavActive('navNewGame');
  rhsPane.style.display = 'none'; 
  state = null; 
  historyStack = [];

  let html = `
    <h2>Start a New Game</h2>
    <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
      <h3 style="color:#aaa;">Game Details</h3>
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="gameNameInput" class="bigInput" placeholder="Enter Game Name (e.g. Friday Night Rummy)" style="margin-bottom:0;">
        <button class="timeBtn" onclick="appendTime('gameNameInput')">🕒 Add Date & Time</button>
      </div>
    </div>
    
    <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px;">
      <h3 style="color:#aaa;">Players</h3>
      <div id="playersDiv">
        <input id="p1" class="bigInput setup-player-input" placeholder="Player 1 Name">
        <input id="p2" class="bigInput setup-player-input" placeholder="Player 2 Name">
      </div>
      <button class="actionBtn util" style="width:100%; padding:15px; font-size:16px;" onclick="addSetupPlayer()">+ Add Player</button>
    </div>
    <button class="bigBtn" onclick="startNewGame()">Start Game</button>
  `;
  
  mainPane.innerHTML = html;
}

function addSetupPlayer() {
  let playersDiv = document.getElementById('playersDiv');
  let currentCount = playersDiv.querySelectorAll('.setup-player-input').length;
  let nextCount = currentCount + 1;
  
  if(nextCount > 6) {
    alert("Maximum of 6 players allowed.");
    return;
  }
  
  let newInput = document.createElement('input');
  newInput.id = 'p' + nextCount;
  newInput.className = 'bigInput setup-player-input';
  newInput.placeholder = 'Player ' + nextCount + ' Name';
  playersDiv.appendChild(newInput);
}

/* CONTINUE GAME SCREEN */
function showContinueScreen() {
  setNavActive('navContinue');
  rhsPane.style.display = 'none'; 
  state = null;
  historyStack = [];

  let activeGames = savedGames.filter(g => g.winner === null);

  let html = `<h2>Continue Existing Game</h2>`;

  if(activeGames.length === 0) {
    html += `<p style="color:#aaa; font-size: 18px;">No active games found. Start a new game from the menu.</p>`;
  } else {
    activeGames.forEach(g => {
      let activePlayersCount = g.players.filter(p => !g.eliminated[p]).length;
      html += `
        <div class="game-card">
          <div>
            <h3 style="margin-bottom: 5px; color: var(--btn-show);">${g.gameName}</h3>
            <p style="margin: 0; color:#aaa; font-size:14px;">Round ${g.round} • ${activePlayersCount} Players Active</p>
          </div>
          <div>
            <button class="resumeBtn" onclick="resumeGame('${g.id}')">▶ Resume</button>
            <button class="deleteBtn" onclick="deleteGame('${g.id}')">🗑 Delete</button>
          </div>
        </div>
      `;
    });
  }

  mainPane.innerHTML = html;
}

/* --- 2. GAME INITIALIZATION & LOADING --- */

function startNewGame() {
  let gName = document.getElementById('gameNameInput').value.trim();
  if(!gName) gName = "Untitled Game " + new Date().toLocaleDateString();

  let players = [];
  let playerInputs = document.querySelectorAll('.setup-player-input');
  
  playerInputs.forEach(input => {
    let v = input.value.trim();
    if(v && !players.includes(v.toUpperCase())) players.push(v.toUpperCase());
  });

  if(players.length < 2) {
    alert("Please enter at least 2 players.");
    return;
  }

  state = {
    id: Date.now().toString(), 
    gameName: gName,
    players: players,
    totals: {},
    roundScores: {},
    eliminated: {},
    dropCooldown: {},
    hasReentered: {}, 
    round: 1,
    showPlayer: null,
    dealerIndex: 0, 
    winner: null,
    roundHistory: []
  };

  players.forEach(p => {
    state.totals[p] = 0;
    state.roundScores[p] = 0;
    state.eliminated[p] = false;
    state.dropCooldown[p] = 0;
    state.hasReentered[p] = false; 
  });

  persistData(); 
  setNavActive(''); 
  render();
}

function resumeGame(gameId) {
  let gameToLoad = savedGames.find(g => g.id === gameId);
  if(gameToLoad) {
    state = gameToLoad;
    setNavActive(''); 
    render();
  } else {
    alert("Error loading game.");
  }
}

/* --- 3. STATE MANAGEMENT (UNDO) --- */

function saveStateToHistory() {
  historyStack.push(JSON.stringify(state));
}

function goBack() {
  if(historyStack.length === 0) {
    alert("Nothing left to undo in this session.");
    return;
  }
  state = JSON.parse(historyStack.pop());
  persistData(); 
  render();
}

/* --- 4. MAIN RENDER LOOP --- */
function render() {
  rhsPane.style.display = 'flex'; 

  let activePlayers = state.players.filter(p => !state.eliminated[p]);
  
  if(activePlayers.length === 1 && !state.winner) {
    state.winner = activePlayers[0];
    persistData();
  }

  let dealerName = state.players[state.dealerIndex];

  let mainHtml = `
    <div class="flex-row" style="margin-bottom: 20px; border-bottom: 1px solid #334; padding-bottom: 10px;">
      <div>
        <h4 style="color:#aaa; margin:0; font-weight:normal;">Playing:</h4>
        <h2 style="margin:0; color:var(--btn-show);">${state.gameName}</h2>
      </div>
      <div>
        <button class="util" onclick="goBack()">Undo Last Click</button>
      </div>
    </div>
    
    <div class="flex-row">
      <h2>Round ${state.round}</h2>
    </div>
    
    ${state.winner ? `<h2 style="color:var(--btn-show); text-align:center; font-size: 2em; padding: 20px; background: rgba(0,230,118,0.1); border-radius: 8px;">🏆 ${state.winner} WINS THE GAME! 🏆</h2>` : ''}

    <table>
      <tr>
        <th>Player</th>
        <th>Actions</th>
        <th>Round</th>
        <th>Total</th>
      </tr>`;

  state.players.forEach(p => {
    let isOut = state.eliminated[p];
    let isDealer = (p === dealerName) && !state.winner;
    let locked = state.winner !== null;

    mainHtml += `
      <tr class="${isOut ? 'eliminated' : ''} ${isDealer ? 'dealer-row' : ''}">
        <td>
          <strong>${p}</strong>
          ${isDealer ? '<br><span class="dealer-badge">Serves Cards</span>' : ''}
          ${state.hasReentered[p] && !isOut ? '<br><span class="reentry-badge">★ RE-ENTERED</span>' : ''}
          ${isOut ? '<br><span style="color:#ff5252; font-size:12px;">ELIMINATED</span>' : ''}
        </td>

        <td style="white-space: nowrap;">
          <button class="actionBtn show ${state.showPlayer===p ? 'active' : ''}" 
          ${isOut || locked ? 'disabled' : ''} 
          onclick="actionShow('${p}')">SHOW</button>

          <button class="actionBtn fc" ${isOut || locked ? 'disabled' : ''} 
          onclick="actionScore('${p}', 80)">FC</button>

          <button class="actionBtn drop" 
          ${state.dropCooldown[p]!==0 || isOut || locked ? 'disabled' : ''} 
          onclick="actionDrop('${p}')">DROP</button>

          <button class="actionBtn md" ${isOut || locked ? 'disabled' : ''} 
          onclick="actionScore('${p}', 40)">MID</button>

          <button class="actionBtn out" ${isOut || locked ? 'disabled' : ''} 
          onclick="actionOut('${p}')">OUT</button>

          <span style="display: inline-block; border-left: 2px solid #555; padding-left: 8px; margin-left: 4px;">
            <input type="number" id="manual_score_${p}" class="manual-input" placeholder="Pts" ${isOut || locked ? 'disabled' : ''}>
            <button class="actionBtn util" ${isOut || locked ? 'disabled' : ''} onclick="actionManual('${p}')">+</button>
          </span>
        </td>

        <td><strong>${state.roundScores[p]}</strong></td>
        <td><h2>${state.totals[p]}</h2></td>
      </tr>`;
  });

  mainHtml += `</table>`;
  
  if(!state.winner) {
    mainHtml += `<button class="bigBtn" style="background:#00e676; color:#111;" onclick="nextRound()">End Round & Calculate</button>`;
  }

  mainPane.innerHTML = mainHtml;
  renderRHS();
}

/* --- 5. ACTIONS --- */
function actionShow(p) {
  if(state.showPlayer && state.showPlayer !== p) {
    alert("Only one player can Show.");
    return;
  }
  saveStateToHistory();
  state.showPlayer = p;
  state.totals[p] -= state.roundScores[p]; 
  state.roundScores[p] = 0;
  persistData();
  render();
}

function actionScore(p, val) {
  if(state.showPlayer === p) return;
  saveStateToHistory();
  state.totals[p] -= state.roundScores[p]; 
  state.roundScores[p] = val;              
  state.totals[p] += val;                  
  persistData();
  render();
}

function actionManual(p) {
  let inputVal = document.getElementById("manual_score_" + p).value;
  let val = parseInt(inputVal);

  if (isNaN(val) || val < 0) {
    alert("Please enter a valid positive number.");
    return;
  }
  if (state.showPlayer === p) return;

  saveStateToHistory();
  state.totals[p] -= state.roundScores[p];
  state.roundScores[p] = val;
  state.totals[p] += val;
  persistData();
  render();
}

function actionDrop(p) {
  saveStateToHistory();
  state.totals[p] -= state.roundScores[p];
  state.roundScores[p] = 20;
  state.totals[p] += 20;
  state.dropCooldown[p] = 1;
  persistData();
  render();
}

function actionOut(p) {
  if (state.eliminated[p]) return; 

  saveStateToHistory();
  state.totals[p] -= state.roundScores[p];
  state.totals[p] += 240;
  state.roundScores[p] = 240;
  state.eliminated[p] = true;

  setTimeout(() => {
    if (!state.hasReentered[p]) {
      if (confirm(`${p} took an OUT! Do they want to RE-ENTER the game? (They can only do this once)`)) {
        state.totals[p] = getReentryScore();
        state.eliminated[p] = false;
        state.roundScores[p] = 0;
        state.dropCooldown[p] = 0; 
        state.hasReentered[p] = true; 
      }
    } else {
      alert(`${p} took an OUT. They have already used their one re-entry and are permanently eliminated.`);
    }
    persistData();
    render();
  }, 10);
}

/* --- 6. NEXT ROUND LOGIC --- */
function nextRound() {
  let active = state.players.filter(p => !state.eliminated[p]);
  
  if(!state.showPlayer && active.length > 1) {
    alert("Please select the player who achieved Show.");
    return;
  }

  state.roundHistory.push({
    round: state.round,
    scores: { ...state.roundScores }
  });

  saveStateToHistory();

  let newlyEliminated = [];
  state.players.forEach(p => {
    if(!state.eliminated[p] && state.totals[p] >= 240) {
      state.eliminated[p] = true;
      newlyEliminated.push(p);
    }
  });

  newlyEliminated.forEach(p => {
    if (!state.hasReentered[p]) {
      if (confirm(`${p} has reached ${state.totals[p]} points! Do they want to RE-ENTER the game? (They can only do this once)`)) {
        state.totals[p] = getReentryScore();
        state.eliminated[p] = false;
        state.dropCooldown[p] = 0;
        state.hasReentered[p] = true; 
      }
    } else {
      alert(`${p} reached ${state.totals[p]} points. They have already used their one re-entry and are permanently eliminated.`);
    }
  });

  state.players.forEach(p => {
    if(state.dropCooldown[p] === 1) state.dropCooldown[p] = 2;
    else if(state.dropCooldown[p] === 2) state.dropCooldown[p] = 0;
  });

  state.players.forEach(p => {
    if(!state.eliminated[p]) state.roundScores[p] = 0;
  });

  let activeAfterEliminations = state.players.filter(p => !state.eliminated[p]);
  do {
    state.dealerIndex = (state.dealerIndex + 1) % state.players.length;
  } while (state.eliminated[state.players[state.dealerIndex]] && activeAfterEliminations.length > 1);

  state.showPlayer = null;
  state.round++;

  persistData();
  render();
}

/* --- 7. RHS PANE & HISTORY --- */
function renderRHS() {
  let html = `<div style="flex:1; overflow-y:auto;">
      <h3>Score History</h3>`;

  if(state.roundHistory.length === 0) {
    html += "<p style='color:#aaa;'>No rounds completed yet.</p>";
  } else {
    html += `<table><tr><th>Rnd</th>`;
    state.players.forEach(p => html += `<th>${p.substring(0,3)}</th>`);
    html += `</tr>`;

    state.roundHistory.forEach(r => {
      html += `<tr><td>${r.round}</td>`;
      state.players.forEach(p => {
        let sc = r.scores[p];
        html += `<td>${sc !== undefined ? sc : '-'}</td>`;
      });
      html += `</tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;

  if(!state.winner) {
    html += `
      <div class="add-player-box">
        <h4>Add Late Player</h4>
        <input id="newPlayerName" class="bigInput" placeholder="Player Name" style="padding:10px; margin-bottom:10px;">
        <button class="bigBtn" style="padding:10px;" onclick="addLatePlayer()">Join Game</button>
      </div>
    `;
  }

  rhsPane.innerHTML = html;
}

/* --- 8. MID-GAME NEW PLAYER LOGIC --- */
function addLatePlayer() {
  let nameInput = document.getElementById('newPlayerName');
  let newName = nameInput.value.trim().toUpperCase();

  if(!newName) return;
  if(state.players.includes(newName)) {
    alert("Player name already exists.");
    return;
  }

  saveStateToHistory();

  let startingScore = getReentryScore();

  state.players.push(newName);
  state.totals[newName] = startingScore;
  state.roundScores[newName] = 0;
  state.eliminated[newName] = false;
  state.dropCooldown[newName] = 0;
  state.hasReentered[newName] = false; 

  persistData();
  render();
}

// Boot up app to the New Game screen by default
showNewGameScreen();

</script>
</body>
</html>
