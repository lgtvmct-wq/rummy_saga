<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --primary-bg: #1a252f;
    --accent: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --text-light: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  body { 
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif; 
    color: var(--text-light); min-height: 100vh;
    background: linear-gradient(rgba(44, 62, 80, 0.9), rgba(44, 62, 80, 0.95)), url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2073&auto=format&fit=crop');
    background-size: cover; background-position: center; background-attachment: fixed;
  }

  #mainApp, #authScreen { display: none; }
  .app-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; backdrop-filter: blur(10px); }
  
  .left-sidebar { width: 260px; background: var(--primary-bg); padding: 25px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
  .main-pane { flex: 3; padding: 30px; overflow-y: auto; }
  .rhs-pane { flex: 1.2; min-width: 320px; background: rgba(0,0,0,0.3); padding: 20px; border-left: 1px solid var(--glass-border); overflow-y: auto; }

  /* Standard Inputs */
  .std-input { 
    width: 100%; height: 55px; padding: 0 15px; margin-bottom: 15px; 
    border-radius: 8px; border: 1px solid var(--glass-border); 
    background: #ffffff; color: #333; font-size: 16px; font-weight: 600; box-sizing: border-box; 
  }

  button { padding: 12px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .navBtn { width: 100%; margin-bottom: 12px; background: rgba(255,255,255,0.08); color: white; text-align: left; padding: 15px; }
  .navBtn.active-nav { background: var(--accent); }
  .actionBtn { background: var(--accent); color: white; width: 100%; height: 55px; font-size: 16px; }

  /* Centered Auth */
  #authScreen { display: flex; position: fixed; inset: 0; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); z-index: 2000; }
  .auth-box { background: #1a252f; padding: 40px; border-radius: 20px; width: 90%; max-width: 420px; text-align: center; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

  /* Profiles & Tables */
  .profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; }
  .profile-card { background: #2c3e50; width: 90%; max-width: 450px; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid var(--glass-border); }
  
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { text-align: left; padding: 12px; color: var(--accent); font-size: 12px; text-transform: uppercase; border-bottom: 2px solid var(--glass-border); }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

  .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  .online { background: var(--accent); color: white; }
  .offline { background: #555; color: white; }

  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow-y: auto; }
    .left-sidebar { width: 100%; height: auto; border-right: none; padding: 15px; }
    .nav-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .main-pane { padding: 20px; }
    .rhs-pane { border-left: none; border-top: 1px solid var(--glass-border); min-width: 100%; }
  }
</style>
</head>
<body>

<!-- PROFILE MODAL -->
<div id="profileModal" class="profile-modal">
    <div class="profile-card">
        <h2 id="pName" style="color:var(--accent); margin-bottom:10px;">User Profile</h2>
        <div id="pStats" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:20px 0;"></div>
        <button class="actionBtn" onclick="document.getElementById('profileModal').style.display='none'">Close</button>
    </div>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--accent); margin-bottom: 30px;">Elite Rummy Circle</h1>
    <div id="loginView">
      <input id="loginEmail" class="std-input" placeholder="Email Address">
      <input id="loginPassword" class="std-input" type="password" placeholder="Password">
      <button class="actionBtn" onclick="login()">Log In</button>
      <a onclick="toggleAuthView('signup')" style="cursor:pointer; display:block; margin-top:20px; font-size:13px; text-decoration:underline;">Register New Account</a>
    </div>
    <div id="signupView" style="display:none">
      <div style="display:flex; gap:10px;"><input id="signupFirst" class="std-input" placeholder="First Name"><input id="signupLast" class="std-input" placeholder="Last Name"></div>
      <div style="text-align:left; font-size:11px; margin-bottom:5px; color:var(--accent);">GENDER</div>
      <select id="signupGender" class="std-input">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <input id="signupEmail" class="std-input" placeholder="Email Address">
      <input id="signupPass" class="std-input" type="password" placeholder="Password">
      <input id="signupConfirm" class="std-input" type="password" placeholder="Confirm Password">
      <button class="actionBtn" style="background:var(--warning); color:#111;" onclick="signup()">Create Account</button>
      <a onclick="toggleAuthView('login')" style="cursor:pointer; display:block; margin-top:20px; font-size:13px; text-decoration:underline;">Back to Login</a>
    </div>
    <p id="authError" style="color:var(--danger); font-size:12px; margin-top:15px;"></p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-wrapper" id="mainApp">
  <div class="left-sidebar">
    <h2 style="color:var(--accent); margin-bottom: 30px;">Menu</h2>
    <div class="nav-section">
      <button id="navNewGame" class="navBtn" onclick="showScreen('newGame')">Start New Game</button>
      <button id="navPlayers" class="navBtn" onclick="showScreen('players')">Players List</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Active Games</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">Game History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
    </div>
    <div style="margin-top:auto; display:flex; gap:10px; padding-top:20px; border-top:1px solid var(--glass-border);">
        <button style="background:var(--warning); flex:1;" onclick="viewMyProfile()">My Profile</button>
        <button style="background:var(--danger); color:white; flex:1;" onclick="handleLogout()">Logout</button>
    </div>
  </div>
  <div class="main-pane" id="mainPane"></div>
  <div class="rhs-pane" id="rhsPane" style="display:none"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8",
  measurementId: "G-D5Z38J9JMC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let playersDb = [], savedGames = [], state = null, currentScreen = '';

auth.onAuthStateChanged(user => {
  if(user) { 
    document.getElementById('authScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    setOnlineStatus(user.uid, true);
    loadData();
    if(!currentScreen) showScreen('newGame');
  } else { 
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
});

/* CRITICAL FIX: Update only the specific player in the list */
async function setOnlineStatus(uid, status) {
  const docRef = db.collection('eliteData').doc('playersData');
  const doc = await docRef.get();
  if(doc.exists) {
    let list = doc.data().list || [];
    let idx = list.findIndex(p => p.id === uid);
    if(idx !== -1) {
        list[idx].isOnline = status;
        await docRef.set({ list: list });
    }
  }
}

function handleLogout() {
  const user = auth.currentUser;
  if(user) {
    setOnlineStatus(user.uid, false).then(() => { auth.signOut(); });
  }
}

function loadData() {
  db.collection('eliteData').doc('playersData').onSnapshot(doc => { 
    if(doc.exists) { 
        playersDb = doc.data().list || []; 
        if(currentScreen === 'players') renderPlayers();
        if(currentScreen === 'newGame') renderNewGame();
    }
  });
  db.collection('eliteGames').onSnapshot(snap => {
    savedGames = []; snap.forEach(d => savedGames.push(d.data()));
    if(state) { let s = savedGames.find(g => g.id === state.id); if(s) { state = s; renderActive(); } }
    if(currentScreen==='continue') renderContinue();
    if(currentScreen==='history') renderHistory();
    if(currentScreen==='reports') renderReports();
  });
}

function login() { 
    auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
    .catch(e => document.getElementById('authError').innerText = e.message); 
}

async function signup() {
  const f = document.getElementById('signupFirst').value, l = document.getElementById('signupLast').value,
        e = document.getElementById('signupEmail').value, p = document.getElementById('signupPass').value,
        c = document.getElementById('signupConfirm').value, g = document.getElementById('signupGender').value;
  if(p !== c) return alert("Passwords do not match!");
  try {
    const cred = await auth.createUserWithEmailAndPassword(e, p);
    const fullName = (f + " " + l).toUpperCase();
    const docRef = db.collection('eliteData').doc('playersData');
    const doc = await docRef.get();
    let list = doc.exists ? (doc.data().list || []) : [];
    list.push({ id: cred.user.uid, fullName, gender: g, isOnline: true });
    await docRef.set({ list: list });
  } catch (err) { alert(err.message); }
}

function showScreen(s) {
  currentScreen = s;
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active-nav'));
  document.getElementById('rhsPane').style.display='none';
  if(s==='newGame') { document.getElementById('navNewGame').classList.add('active-nav'); renderNewGame(); }
  if(s==='players') { document.getElementById('navPlayers').classList.add('active-nav'); renderPlayers(); }
  if(s==='continue') { document.getElementById('navContinue').classList.add('active-nav'); renderContinue(); }
  if(s==='history') { document.getElementById('navHistory').classList.add('active-nav'); renderHistory(); }
  if(s==='reports') { document.getElementById('navReports').classList.add('active-nav'); renderReports(); }
}

function renderPlayers() {
  let html = `<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Registered Players</h2>
    <button onclick="showScreen('newGame')" style="background:var(--accent)">← Back</button>
  </div>
  <table><tr><th>Full Name</th><th>Status</th><th>Profile</th></tr>`;
  playersDb.sort((a,b)=>a.fullName.localeCompare(b.fullName)).forEach(p => {
    html += `<tr>
      <td><b>${p.fullName}</b></td>
      <td><span class="status-tag ${p.isOnline?'online':'offline'}">${p.isOnline?'ONLINE':'OFFLINE'}</span></td>
      <td><button onclick="viewProfile('${p.fullName}')">View Profile</button></td>
    </tr>`;
  });
  document.getElementById('mainPane').innerHTML = html + `</table>`;
}

function renderNewGame() {
  document.getElementById('mainPane').innerHTML = `
    <h2>Start New Game</h2>
    <div style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px; border:1px solid var(--glass-border);">
        <input id="gName" class="std-input" placeholder="Enter Game Name">
        <div id="dynamicPlayers"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="navBtn" style="flex:1; text-align:center;" onclick="addPlayerField()">+ Add Player</button>
            <button class="actionBtn" style="flex:1.5;" onclick="startGame()">Confirm & Start Game</button>
        </div>
    </div>`;
}

function addPlayerField() {
  const onlineOnes = playersDb.filter(p => p.isOnline);
  if(!onlineOnes.length) return alert("No players are currently online.");
  
  let opts = `<option value="">-- Choose Online Player --</option>` + 
             onlineOnes.map(p => `<option value="${p.fullName}">${p.fullName}</option>`).join('');
             
  const div = document.createElement('div');
  div.style="display:flex; gap:10px; margin-bottom:10px;";
  div.innerHTML = `<select class="std-input" style="flex:1; margin-bottom:0;">${opts}</select>
                   <button onclick="this.parentElement.remove()" style="background:var(--danger); height:55px; width:55px;">✕</button>`;
  document.getElementById('dynamicPlayers').appendChild(div);
}

function startGame() {
  const name = document.getElementById('gName').value || "Unnamed Game";
  const selects = Array.from(document.querySelectorAll('#dynamicPlayers select'));
  const players = selects.map(s => s.value).filter(v => v !== "");
  
  if(players.length < 2) return alert("Please add at least 2 players.");
  if(new Set(players).size !== players.length) return alert("Duplicate players selected.");

  const now = new Date();
  state = {
    id: Date.now().toString(),
    name: name,
    startTime: now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
    endTime: null,
    players: players,
    totals: {},
    round: 1,
    history: [],
    winner: null,
    actionStats: {}
  };

  players.forEach(p => { 
    state.totals[p] = 0; 
    state.actionStats[p] = { shows: 0, fcs: 0, drops: 0, mds: 0, outs: 0 }; 
  });

  db.collection('eliteGames').doc(state.id).set(state);
  renderActive();
}

function renderActive() {
  document.getElementById('rhsPane').style.display='block';
  let html = `<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="color:var(--accent); margin:0;">${state.name}</h2>
    <span style="font-size:12px; opacity:0.7;">Started: ${state.startTime}</span>
  </div>
  <table><tr><th>Player</th><th>Tactics</th><th>Total</th></tr>`;

  state.players.forEach(p => {
    let isOut = state.totals[p] >= 240;
    html += `<tr style="${isOut?'opacity:0.4; background:rgba(231,76,60,0.15);':''}">
      <td><b>${p}</b><br><div style="display:flex; gap:4px; margin-top:5px;"><input type="number" id="manual-${p}" style="width:45px;" placeholder="0"><button onclick="scoreManual('${p}')">+</button></div></td>
      <td>
        <button style="background:var(--accent)" onclick="score('${p}',0,'shows')" ${isOut?'disabled':''}>S</button>
        <button style="background:var(--warning)" onclick="score('${p}',20,'drops')" ${isOut?'disabled':''}>D</button>
        <button style="background:#8e44ad; color:white;" onclick="score('${p}',40,'mds')" ${isOut?'disabled':''}>MD</button>
        <button style="background:var(--danger); color:white;" onclick="score('${p}',80,'fcs')" ${isOut?'disabled':''}>FC</button>
      </td>
      <td><h3 style="margin:0">${state.totals[p]}</h3></td>
    </tr>`;
  });

  document.getElementById('mainPane').innerHTML = html + `</table><button class="actionBtn" style="margin-top:20px;" onclick="nextRound()">Next Round</button>`;
  renderHistoryPane();
}

function score(p, val, type) {
  state.totals[p] += val;
  if(type) state.actionStats[p][type]++;
  db.collection('eliteGames').doc(state.id).set(state);
}

function scoreManual(p) {
  let v = parseInt(document.getElementById(`manual-${p}`).value) || 0;
  score(p, v);
  document.getElementById(`manual-${p}`).value = "";
}

function nextRound() {
  state.history.push({ round: state.round, totals: {...state.totals} });
  state.round++;
  let active = state.players.filter(p => state.totals[p] < 240);
  if(active.length === 1) {
    state.winner = active[0];
    const now = new Date();
    state.endTime = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  db.collection('eliteGames').doc(state.id).set(state);
}

function viewProfile(name) {
    const p = playersDb.find(x => x.fullName === name);
    if(!p) return;
    document.getElementById('pName').innerText = p.fullName;
    let matches = savedGames.filter(g => g.winner && g.players.includes(name));
    let wins = matches.filter(g => g.winner === name).length;
    document.getElementById('pStats').innerHTML = `
        <div style="padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">Matches: ${matches.length}</div>
        <div style="padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">Wins: ${wins}</div>
        <div style="padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">Gender: ${p.gender}</div>
        <div style="padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">Status: ${p.isOnline?'Online':'Offline'}</div>
    `;
    document.getElementById('profileModal').style.display = 'flex';
}

function viewMyProfile() {
    const me = playersDb.find(p => p.id === auth.currentUser.uid);
    if(me) viewProfile(me.fullName);
}

function renderContinue() {
  let active = savedGames.filter(g => !g.winner);
  document.getElementById('mainPane').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Active Games</h2>
        <button onclick="showScreen('newGame')" style="background:var(--accent)">← Back</button>
    </div>` + 
    active.map(g => `<div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>${g.name}</b><br><small>Started: ${g.startTime}</small></div>
        <button onclick="resume('${g.id}')" style="background:var(--accent)">Resume</button>
    </div>`).join('');
}

function resume(id) { state = savedGames.find(g => g.id === id); renderActive(); }

function renderHistory() {
  let finished = savedGames.filter(g => g.winner);
  document.getElementById('mainPane').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Game History</h2>
        <button onclick="showScreen('newGame')" style="background:var(--accent)">← Back</button>
    </div>` + 
    finished.map(g => `<div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between;"><b>${g.name}</b> <span style="color:var(--accent)">Winner: ${g.winner}</span></div>
        <div style="font-size:11px; opacity:0.6; margin-top:5px;">${g.startTime} — ${g.endTime}</div>
    </div>`).join('');
}

function renderReports() {
  let html = `<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Reports</h2>
    <button onclick="showScreen('newGame')" style="background:var(--accent)">← Back</button>
  </div><table><tr><th>Player</th><th>Win %</th><th>Matches</th></tr>`;
  playersDb.forEach(p => {
    let m = savedGames.filter(g => g.winner && g.players.includes(p.fullName));
    let w = m.filter(g => g.winner === p.fullName).length;
    html += `<tr><td><b>${p.fullName}</b></td><td>${m.length?((w/m.length)*100).toFixed(1):0}%</td><td>${m.length}</td></tr>`;
  });
  document.getElementById('mainPane').innerHTML = html + `</table>`;
}

function renderHistoryPane() {
  let h = "<h3>Game Logs</h3>";
  state.history.forEach(r => h += `<div style="font-size:11px; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
    <b>Round ${r.round}:</b><br>${Object.entries(r.totals).map(([p, s]) => p + ": " + s).join(' | ')}
  </div>`);
  document.getElementById('rhsPane').innerHTML = h;
}

function toggleAuthView(v) {
  document.getElementById('loginView').style.display = v==='login'?'block':'none';
  document.getElementById('signupView').style.display = v==='signup'?'block':'none';
}
</script>
</body>
</html>
