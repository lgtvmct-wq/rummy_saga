<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>

:root{
  --bg:#1a252f;
  --card:#243240;
  --accent:#27ae60;
  --danger:#e74c3c;
  --warning:#f39c12;
  --white:#fff;
  --border:rgba(255,255,255,0.1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:var(--card);
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  border:1px solid var(--border);
}

.input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}

.btn{
  border:none;
  border-radius:10px;
  padding:14px 18px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.btn:hover{
  opacity:0.9;
}

.btn-primary{
  background:var(--accent);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-warning{
  background:var(--warning);
  color:black;
}

.btn-secondary{
  background:#34495e;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

th{
  color:var(--accent);
  text-align:left;
}

.rules-banner{
  background:rgba(39,174,96,0.15);
  border:1px solid var(--accent);
  padding:14px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.6;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:14px 20px;
  border-radius:10px;
  z-index:9999;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  width:90%;
  max-width:400px;
  background:var(--card);
  border-radius:14px;
  padding:20px;
}

.rule-buttons{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.score-out{
  color:var(--danger);
  font-weight:bold;
}

@media(max-width:768px){

  .rule-buttons{
    flex-direction:column;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="card">

    <h1 style="margin-bottom:20px;color:var(--accent)">
      Elite Rummy Circle
    </h1>

    <!-- LOGIN -->

    <div id="authSection">

      <input
        id="email"
        class="input"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        class="input"
        placeholder="Password"
      >

      <button
        id="loginBtn"
        class="btn btn-primary"
      >
        Login
      </button>

    </div>

    <!-- APP -->

    <div id="appSection" style="display:none">

      <!-- GAME SETUP -->

      <div class="card">

        <h2 style="margin-bottom:15px">
          Start Match
        </h2>

        <input
          id="gameName"
          class="input"
          placeholder="Match Name"
        >

        <textarea
          id="players"
          class="input"
          rows="5"
          placeholder="Enter player names separated by commas"
        ></textarea>

        <h3 style="margin-bottom:15px">
          Select Ruleset
        </h3>

        <div class="rule-buttons">

          <button
            class="btn btn-primary"
            id="standardRulesBtn"
          >
            Standard Rule
          </button>

          <button
            class="btn btn-warning"
            id="customRulesBtn"
          >
            Custom Rule
          </button>

        </div>

        <div id="selectedRuleText"></div>

        <button
          class="btn btn-primary"
          style="margin-top:20px"
          id="startGameBtn"
        >
          Start Match
        </button>

      </div>

      <!-- ACTIVE GAME -->

      <div
        class="card"
        id="gameContainer"
        style="display:none"
      >

        <h2 id="gameTitle"></h2>

        <div
          class="rules-banner"
          id="rulesBanner"
        ></div>

        <table>

          <thead>
            <tr>
              <th>Player</th>
              <th>Round Score</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="scoreTable"></tbody>

        </table>

        <button
          class="btn btn-primary"
          style="margin-top:20px"
          id="nextRoundBtn"
        >
          Next Round
        </button>

      </div>

      <button
        class="btn btn-danger"
        style="margin-top:20px"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </div>

</div>

<!-- CUSTOM RULE MODAL -->

<div
  class="modal"
  id="rulesModal"
>

  <div class="modal-content">

    <h2 style="margin-bottom:20px">
      Custom Rules
    </h2>

    <label>
      Elimination Score
    </label>

    <input
      id="customMaxScore"
      type="number"
      class="input"
      value="240"
    >

    <label>
      Maximum Re-entries
    </label>

    <input
      id="customReentries"
      type="number"
      class="input"
      value="1"
    >

    <button
      class="btn btn-primary"
      style="width:100%"
      id="applyRulesBtn"
    >
      Apply Rules
    </button>

  </div>

</div>

<script>

/* =========================================
   APP STATE
========================================= */

const App = {

  currentGame:null,

  selectedRules:{
    maxScore:240,
    maxReentries:1,
    isCustom:false
  }

};

/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH_DOMAIN",
  projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* =========================================
   TOAST
========================================= */

function toast(message){

  const div = document.createElement('div');

  div.className = 'toast';

  div.innerText = message;

  document.body.appendChild(div);

  setTimeout(() => {

    div.remove();

  },3000);

}

/* =========================================
   AUTH
========================================= */

auth.onAuthStateChanged(user => {

  if(user){

    document.getElementById(
      'authSection'
    ).style.display = 'none';

    document.getElementById(
      'appSection'
    ).style.display = 'block';

  }else{

    document.getElementById(
      'authSection'
    ).style.display = 'block';

    document.getElementById(
      'appSection'
    ).style.display = 'none';

  }

});

async function login(){

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    toast('Welcome');

  }catch(err){

    toast(err.message);

  }

}

async function logout(){

  await auth.signOut();

}

/* =========================================
   RULESET
========================================= */

function useStandardRules(){

  App.selectedRules = {

    maxScore:240,
    maxReentries:1,
    isCustom:false

  };

  document.getElementById(
    'selectedRuleText'
  ).innerHTML = `
    <div class="rules-banner">
      STANDARD RULE ACTIVE<br>
      240 Elimination | 1 Re-entry
    </div>
  `;

}

function openCustomRules(){

  document.getElementById(
    'rulesModal'
  ).style.display = 'flex';

}

function applyCustomRules(){

  const maxScore = Number(
    document.getElementById(
      'customMaxScore'
    ).value
  );

  const maxReentries = Number(
    document.getElementById(
      'customReentries'
    ).value
  );

  if(maxScore < 50){

    toast('Minimum elimination score is 50');

    return;
  }

  if(maxReentries < 0){

    toast('Invalid re-entry count');

    return;
  }

  App.selectedRules = {

    maxScore,
    maxReentries,
    isCustom:true

  };

  document.getElementById(
    'rulesModal'
  ).style.display = 'none';

  document.getElementById(
    'selectedRuleText'
  ).innerHTML = `
    <div class="rules-banner">
      CUSTOM RULE ACTIVE<br>
      ${maxScore} Elimination |
      ${maxReentries} Re-entries
    </div>
  `;

  toast('Custom rules applied');

}

/* =========================================
   CREATE MATCH
========================================= */

function createGame(){

  const gameName =
    document.getElementById(
      'gameName'
    ).value;

  const players =
    document
      .getElementById('players')
      .value
      .split(',')
      .map(p => p.trim())
      .filter(Boolean);

  if(players.length < 2){

    toast('Minimum 2 players required');

    return;
  }

  const game = {

    id:Date.now().toString(),

    name:gameName,

    players,

    round:1,

    totals:{},

    roundScores:{},

    eliminated:{},

    reEntryCount:{},

    winner:null,

    rules:App.selectedRules

  };

  players.forEach(player => {

    game.totals[player] = 0;

    game.roundScores[player] = 0;

    game.eliminated[player] = false;

    game.reEntryCount[player] = 0;

  });

  App.currentGame = game;

  saveGame();

  renderGame();

  toast(
    `${game.name} started with ${
      game.rules.isCustom
      ? 'Custom'
      : 'Standard'
    } Rules`
  );

}

/* =========================================
   SAVE GAME
========================================= */

async function saveGame(){

  try{

    await db
      .collection('eliteGames')
      .doc(App.currentGame.id)
      .set(App.currentGame);

  }catch(err){

    console.error(err);

  }

}

/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

  const game = App.currentGame;

  game.players.forEach(player => {

    if(game.eliminated[player]) return;

    const input =
      document.getElementById(
        `score-${player}`
      );

    const value = Number(input.value);

    if(isNaN(value)) return;

    game.roundScores[player] = value;

    game.totals[player] += value;

    if(
      game.totals[player]
      >= game.rules.maxScore
    ){

      game.eliminated[player] = true;

    }

  });

  game.round++;

  checkWinner();

  saveGame();

  renderGame();

}

/* =========================================
   WINNER CHECK
========================================= */

function checkWinner(){

  const game = App.currentGame;

  const activePlayers =
    game.players.filter(player => {

      return !game.eliminated[player];

    });

  if(activePlayers.length === 1){

    game.winner = activePlayers[0];

    toast(
      `${game.winner} wins the match`
    );

  }

}

/* =========================================
   RENDER GAME
========================================= */

function renderGame(){

  const game = App.currentGame;

  document.getElementById(
    'gameContainer'
  ).style.display = 'block';

  document.getElementById(
    'gameTitle'
  ).innerText =
    `${game.name} - Round ${game.round}`;

  document.getElementById(
    'rulesBanner'
  ).innerHTML = `

    ${
      game.rules.isCustom
      ? 'CUSTOM RULESET ACTIVE'
      : 'STANDARD RULESET ACTIVE'
    }

    <br>

    Elimination:
    ${game.rules.maxScore}

    |

    Re-entries:
    ${game.rules.maxReentries}

  `;

  const tbody =
    document.getElementById(
      'scoreTable'
    );

  tbody.innerHTML = '';

  game.players.forEach(player => {

    const total =
      game.totals[player];

    const isOut =
      game.eliminated[player];

    const tr =
      document.createElement('tr');

    tr.innerHTML = `

      <td>
        ${player}
      </td>

      <td>

        <input
          id="score-${player}"
          class="input"
          type="number"
          value="0"
          ${
            isOut
            ? 'disabled'
            : ''
          }
        >

      </td>

      <td>
        ${total}
      </td>

      <td>

        ${
          isOut
          ? `<span class="score-out">
              OUT
            </span>`
          : 'ACTIVE'
        }

      </td>

    `;

    tbody.appendChild(tr);

  });

  if(game.winner){

    document.getElementById(
      'nextRoundBtn'
    ).disabled = true;

  }

}

/* =========================================
   EVENTS
========================================= */

document
  .getElementById('loginBtn')
  .addEventListener('click', login);

document
  .getElementById('logoutBtn')
  .addEventListener('click', logout);

document
  .getElementById('standardRulesBtn')
  .addEventListener(
    'click',
    useStandardRules
  );

document
  .getElementById('customRulesBtn')
  .addEventListener(
    'click',
    openCustomRules
  );

document
  .getElementById('applyRulesBtn')
  .addEventListener(
    'click',
    applyCustomRules
  );

document
  .getElementById('startGameBtn')
  .addEventListener(
    'click',
    createGame
  );

document
  .getElementById('nextRoundBtn')
  .addEventListener(
    'click',
    nextRound
  );

/* =========================================
   DEFAULT RULE
========================================= */

useStandardRules();

</script>

</body>
</html>
