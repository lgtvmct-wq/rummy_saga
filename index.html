<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greens Rummy Saga 2026</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  display:flex;
}

.main { flex:1; padding:10px; text-align:center; }
.right { width:200px; background:#111; padding:10px; }

.header { font-size:22px; color:#00e676; }

.card {
  background:#1e2a38;
  padding:10px;
  border-radius:12px;
}

/* PLAYER SELECT */
.playerBox {
  background:#1e2a38;
  margin:5px; padding:10px;
  border-radius:8px; cursor:pointer;
}
.playerBox.selected { background:#00c853; color:black; }

/* TABLE */
table { width:100%; border-collapse: collapse; }
td, th { border:1px solid #555; padding:6px; }

/* BUTTONS */
button {
  padding:6px 10px;
  margin:2px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.activeBtn {
  outline:2px solid #fff;
  transform:scale(1.1);
}

.show { background:#00e676; }
.fc { background:#ff5252; }
.drop { background:#ff9800; }
.md { background:#ffc107; }
.out { background:#9c27b0; }

.dealer { background:#ffd700; color:black; }

.outPlayer {
  opacity:0.5;
  text-decoration:line-through;
}
</style>
</head>

<body>

<div class="main">

<div id="setup">
<h2>🏆 GREENS RUMMY SAGA 2026</h2>
<div id="inputs"></div>
<button onclick="prepareSelection()">Next</button>
<div id="selection"></div>
</div>

<div id="game" style="display:none">
<div class="header" id="header"></div>

<div class="card">
<table id="table"></table>
</div>

<br>
<button onclick="nextGame()">Next</button>
<button onclick="backGame()">Back</button>
</div>

</div>

<div class="right">
<h3>Leaderboard</h3>
<table id="lb"></table>
</div>

<script>

/* INPUTS */
let html="";
for(let i=1;i<=12;i++){
  html+=`<input id="p${i}" placeholder="Player ${i}"><br>`;
}
inputs.innerHTML=html;

/* STATE */
let state={
  players:[],
  activePlayers:[],
  totals:{},
  saga:1,
  game:1,
  dealer:0,
  dropCooldown:{},
  history:{},
  showUsed:false,
  currentSelection:{}
};

/* SELECTION */
function prepareSelection(){
  let pool=[];
  for(let i=1;i<=12;i++){
    let v=document.getElementById("p"+i).value.trim();
    if(v) pool.push(v.toUpperCase());
  }

  let s="";
  pool.forEach(p=>{
    s+=`
    <div class="playerBox" onclick="toggle(this)">
      <input type="checkbox" value="${p}" hidden>
      ${p}
    </div>`;
  });

  s+=`<br><button onclick="startGame()">Start</button>`;
  selection.innerHTML=s;
}

function toggle(box){
  let cb=box.querySelector("input");
  cb.checked=!cb.checked;
  box.classList.toggle("selected");
}

/* START */
function startGame(){
  let selected=[...document.querySelectorAll(".playerBox input:checked")]
    .map(x=>x.value);

  if(selected.length!==6){
    alert("Select exactly 6 players");
    return;
  }

  state.players=[...selected];
  state.activePlayers=[...selected];

  state.players.forEach(p=>{
    state.totals[p]=0;
    state.dropCooldown[p]=0;
  });

  setup.style.display="none";
  game.style.display="block";

  render();
}

/* RENDER */
function render(){
  header.innerText=`Saga ${state.saga} • Game ${state.game}`;
  state.showUsed=false;
  renderTable();
  renderLB();
}

/* TABLE */
function renderTable(){
  table.innerHTML="<tr><th>Player</th><th>Actions</th><th>Score</th></tr>";

  state.activePlayers.forEach((p,i)=>{
    let dealer=i===state.dealer;
    let canDrop=state.dropCooldown[p]===0;

    table.innerHTML+=`
    <tr id="row-${p}" class="${dealer?'dealer':''}">
      <td>${p}${dealer?' 🎴':''}</td>
      <td>
        <button class="show" onclick="toggleAction('${p}','S',0,this)">S</button>
        <button class="fc" onclick="toggleAction('${p}','FC',80,this)">FC</button>
        <button class="drop" ${canDrop?'':'disabled'} onclick="toggleAction('${p}','D',20,this)">D</button>
        <button class="md" onclick="toggleAction('${p}','MD',40,this)">MD</button>
        <button class="out" onclick="toggleAction('${p}','OUT',240,this)">OUT</button>
      </td>
      <td id="cell-${p}"></td>
    </tr>`;
  });
}

/* TOGGLE ACTION */
function toggleAction(player,type,val,btn){

  if(!state.currentSelection[state.saga])
    state.currentSelection[state.saga]={};

  if(!state.currentSelection[state.saga][state.game])
    state.currentSelection[state.saga][state.game]={};

  let sel=state.currentSelection[state.saga][state.game];

  // UNSELECT
  if(sel[player] && sel[player].type===type){
    applyScore(player,0);
    delete sel[player];
    btn.classList.remove("activeBtn");
    document.getElementById("cell-"+player).innerText="";
    return;
  }

  // SHOW RULE
  if(type==="S"){
    if(state.showUsed){
      alert("Only one Show allowed");
      return;
    }
    state.showUsed=true;
  }

  // CLEAR previous button highlight
  let row=document.getElementById("row-"+player);
  row.querySelectorAll("button").forEach(b=>b.classList.remove("activeBtn"));

  btn.classList.add("activeBtn");

  sel[player]={type,val};
  applyScore(player,val);

  document.getElementById("cell-"+player).innerText=val;

  if(type==="D") state.dropCooldown[player]=1;

  // OUT → mark
  if(type==="OUT"){
    document.getElementById("row-"+player).classList.add("outPlayer");
  }
}

/* APPLY */
function applyScore(p,val){
  if(!state.history[state.saga]) state.history[state.saga]={};
  if(!state.history[state.saga][state.game]) state.history[state.saga][state.game]={};

  let prev=state.history[state.saga][state.game][p]||0;
  state.totals[p]-=prev;

  state.history[state.saga][state.game][p]=val;
  state.totals[p]+=val;

  renderLB();
}

/* LEADERBOARD */
function renderLB(){
  lb.innerHTML="<tr><th>Player</th><th>Total</th></tr>";

  let sorted=[...state.players].sort((a,b)=>state.totals[a]-state.totals[b]);

  sorted.forEach(p=>{
    lb.innerHTML+=`<tr><td>${p}</td><td>${state.totals[p]}</td></tr>`;
  });
}

/* NEXT */
function nextGame(){

  // Remove OUT players
  state.activePlayers = state.activePlayers.filter(p=>{
    return !(state.history[state.saga]?.[state.game]?.[p]===240);
  });

  // cooldown
  for(let p in state.dropCooldown){
    if(state.dropCooldown[p]===1) state.dropCooldown[p]=2;
    else if(state.dropCooldown[p]===2) state.dropCooldown[p]=0;
  }

  state.game++;
  state.dealer=(state.dealer+1)%state.activePlayers.length;

  if(state.game>5){
    state.game=1;
    state.saga++;
    state.activePlayers=[...state.players];
  }

  render();
}

/* BACK */
function backGame(){
  if(state.saga===1 && state.game===1) return;

  state.game--;
  if(state.game<1){
    state.game=5;
    state.saga--;
  }

  render();
}

</script>

</body>
</html>
