<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.12);
    --sidebar-bg: rgba(15, 32, 39, 0.98);
    --btn-show: #00e676; 
    --btn-fc: #d32f2f;   /* Viking Red */
    --btn-drop: #ff9800; 
    --btn-md: #ffc107;   
    --text-light: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.2);
  }

  body { 
    margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; 
    background-image: linear-gradient(rgba(18, 55, 68, 0.6), rgba(15, 32, 39, 0.7)), url('https://images.unsplash.com/photo-1541278107931-e006523892df?q=80&w=2070&auto=format&fit=crop');
    background-size: cover; background-position: center; background-attachment: fixed;
  }

  #mainApp, #authScreen { display: none; }
  .app-wrapper { display: flex; flex-direction: row; height: 100vh; width: 100vw; overflow: hidden; backdrop-filter: blur(8px); }
  
  /* Sidebar Fixes */
  .left-sidebar { width: 240px; background: var(--sidebar-bg); padding: 20px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; z-index: 10; overflow-y: hidden;}
  .player-roster-section { flex-grow: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 15px; }
  .roster-item { display: flex; align-items: center; font-size: 13px; padding: 12px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; position: relative; z-index: 5;}
  .roster-item:hover { background: rgba(0,230,118,0.2); border-color: var(--btn-show); }
  
  .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
  .dot-online { background: #00e676; box-shadow: 0 0 10px #00e676; }
  .dot-offline { background: #555; }
  
  .main-pane { flex: 2.5; padding: 20px 30px; overflow-y: auto; }
  .rhs-pane { flex: 1; min-width: 320px; background: rgba(0,0,0,0.3); padding: 20px; border-left: 1px solid var(--glass-border); overflow-y: auto; backdrop-filter: blur(15px);}

  /* Inputs */
  .bigInput, .bigSelect { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.95); color: #000 !important; font-weight: 600; box-sizing: border-box; }
  .game-name-box { padding: 22px 15px !important; font-size: 22px !important; border: 2px solid var(--btn-show) !important; height: 75px; }

  .bigInput::placeholder { color: #666 !important; }
  .score-input { width: 55px; padding: 8px; background: rgba(255,255,255,0.95); color: #000 !important; border-radius: 4px; text-align: center; font-weight: bold; }
  
  button { padding: 10px 15px; margin: 2px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .navBtn { width: 100%; margin-bottom: 8px; background: rgba(255,255,255,0.1); color: white; text-align: left; padding: 15px; }
  .navBtn.active-nav { background: var(--btn-show); color: #111; }
  
  /* AUTH CENTERING FIX */
  #authScreen { 
    display: flex; position: fixed; inset: 0; 
    width: 100vw; height: 100vh; z-index: 1000; 
    justify-content: center; align-items: center; 
    background: rgba(0,0,0,0.4);
  }
  .auth-box { 
    background: rgba(15, 32, 39, 0.95); padding: 35px; border-radius: 20px; 
    width: 90%; max-width: 380px; border: 1px solid var(--glass-border); 
    backdrop-filter: blur(15px); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .authBtn { width: 100%; margin: 10px 0; font-size: 16px; padding: 16px; border-radius: 12px; }
  .loginBtn { background: var(--btn-show); color: #111; }
  .signupBtn { background: var(--btn-fc); color: white; }

  /* Modals */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
  .modal-content { background: #1a2a3a; width: 95%; max-width: 520px; padding: 30px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
  .stat-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
  .stat-val { font-size: 18px; font-weight: bold; color: var(--btn-show); display: block; }
  .stat-lbl { font-size: 10px; color: #aaa; text-transform: uppercase; }

  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow-y: auto; }
    .left-sidebar { width: 100%; height: auto; border-right: none; padding: 10px; box-sizing: border-box; }
    .nav-section { display: flex; overflow-x: auto; gap: 8px; }
    .navBtn { width: auto; font-size: 11px; padding: 10px 14px; margin: 0; }
    .player-roster-section { display: flex; flex-direction: row; gap: 10px; overflow-x: auto; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); }
    .roster-item { padding: 8px 14px; font-size: 12px; flex-shrink: 0; margin-bottom: 0; }
  }
</style>
</head>
<body>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal-overlay">
  <div class="modal-content">
    <img id="profAvatar" style="width:120px; height:120px; border-radius:50%; border:4px solid var(--btn-show); background:#fff; margin-bottom:15px;" src="">
    <h2 id="profName" style="color:var(--btn-show); margin:0; font-size: 26px;">Warrior</h2>
    <p id="profViking" style="color:#aaa; font-size:14px; font-style:italic; margin:8px 0 20px 0;"></p>
    <div class="stat-grid">
      <div class="stat-box"><span class="stat-val" id="statPlayed">0</span><span class="stat-lbl">Played</span></div>
      <div class="stat-box"><span class="stat-val" id="statWon">0</span><span class="stat-lbl">Won</span></div>
      <div class="stat-box"><span class="stat-val" id="statShows">0</span><span class="stat-lbl">S (0)</span></div>
      <div class="stat-box"><span class="stat-val" id="statDrops">0</span><span class="stat-lbl">D (20)</span></div>
      <div class="stat-box"><span class="stat-val" id="statMds">0</span><span class="stat-lbl">MD (40)</span></div>
      <div class="stat-box"><span class="stat-val" id="statFcs">0</span><span class="stat-lbl">FC (80)</span></div>
    </div>
    <div id="aiReport" style="background:rgba(0,230,118,0.1); border-left: 4px solid var(--btn-show); padding:15px; margin-top:10px; border-radius:10px; font-size:14px; text-align:left; color:white; line-height: 1.5;"></div>
    <button class="authBtn loginBtn" style="margin-top:25px;" onclick="closeModal('profileModal')">Close Profile</button>
  </div>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--btn-show); font-size: 34px; margin-bottom: 30px;">Elite Rummy</h1>
    
    <div id="loginView">
      <input id="loginEmail" class="bigInput" placeholder="Email Address">
      <div style="position:relative;">
        <input id="loginPassword" class="bigInput" type="password" placeholder="Password">
        <span onclick="togglePass('loginPassword')" style="position:absolute; right:15px; top:15px; color:#444; cursor:pointer; font-size: 20px;">👁️</span>
      </div>
      <button class="authBtn loginBtn" onclick="login()">Log In</button>
      <a onclick="toggleAuthView('signup')" style="cursor:pointer; font-size:12px; text-decoration:underline; color:#fff; display:block; margin-top:15px;">New Viking? Join the Horde</a>
    </div>

    <div id="signupView" style="display:none">
      <div style="display:flex; gap:10px;"><input id="signupFirst" class="bigInput" placeholder="First Name"><input id="signupLast" class="bigInput" placeholder="Surname"></div>
      
      <div style="text-align:left; font-size:11px; color:var(--btn-show); font-weight:bold; margin: 5px 0 5px 5px;">GENDER</div>
      <select id="signupGender" class="bigSelect">
        <option value="male">Warrior (Male)</option>
        <option value="female">Shield-Maiden (Female)</option>
      </select>

      <div style="display:flex; gap:10px; margin-bottom:12px;">
        <input id="signupViking" class="bigInput" style="margin-bottom:0; background:#eee; color:#111;" readonly>
        <button onclick="uiGenerateViking()" style="background:var(--btn-show); color:#111; padding:0 20px; border-radius:10px;">🎲</button>
      </div>
      <input id="signupEmail" class="bigInput" placeholder="Email Address">
      <div style="position:relative;">
        <input id="signupPass" class="bigInput" type="password" placeholder="Password">
        <span onclick="togglePass('signupPass')" style="position:absolute; right:15px; top:15px; color:#444; cursor:pointer;">👁️</span>
      </div>
      <input id="signupConfirm" class="bigInput" type="password" placeholder="Confirm Password">
      <button class="authBtn signupBtn" onclick="signup()">Sign Up</button>
      <a onclick="toggleAuthView('login')" style="cursor:pointer; font-size:12px; text-decoration:underline; color:#fff; display:block; margin-top:15px;">Back to Login</a>
    </div>
    <p id="authError" style="color:#ff5252; font-size:12px; margin-top:15px; font-weight:bold;"></p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-wrapper" id="mainApp">
  <div class="left-sidebar">
    <div style="display:flex; justify-content:space-between; margin-bottom:25px; gap:10px;">
        <button class="navBtn" style="background:var(--btn-md); color:#111; margin:0; flex:1; text-align:center; padding:12px;" onclick="viewMyProfile()">Profile</button>
        <button class="navBtn" style="background:var(--btn-fc); color:white; margin:0; flex:1; text-align:center; padding:12px;" onclick="handleLogout()">Logout</button>
    </div>
    <h2 style="color:var(--btn-show); font-size: 22px; margin: 0 0 20px 0;">Elite Rummy</h2>
    <div class="nav-section">
      <button id="navNewGame" class="navBtn" onclick="showScreen('newGame')">New Game</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Continue</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
    </div>
    <div class="player-roster-section">
        <h4 style="font-size:11px; color:#00e676; text-transform:uppercase; letter-spacing:1px; margin:0 0 12px 0;">Viking Horde</h4>
        <div id="sidebarRoster"></div>
    </div>
  </div>
  <div class="content-area">
    <div class="main-pane" id="mainPane"></div>
    <div class="rhs-pane" id="rhsPane" style="display:none"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8",
  measurementId: "G-D5Z38J9JMC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let playersDb = [], savedGames = [], state = null, currentScreen = '';

function openModal(id) { document.getElementById(id).style.display='flex'; }
function closeModal(id) { document.getElementById(id).style.display='none'; }
function togglePass(id) { const x = document.getElementById(id); x.type = x.type === "password" ? "text" : "password"; }

auth.onAuthStateChanged(user => {
  if(user) { 
    document.getElementById('authScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    setOnlineStatus(user.uid, true);
    loadData();
    if(!currentScreen) showScreen('newGame');
  } else { 
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
});

function setOnlineStatus(uid, status) {
  db.collection('eliteData').doc('playersData').get().then(doc => {
    let list = doc.data().list || [];
    let idx = list.findIndex(p => p.id === uid);
    if(idx !== -1) {
        list[idx].isOnline = status;
        db.collection('eliteData').doc('playersData').set({ list: list });
    }
  });
}

function handleLogout() {
  const user = auth.currentUser;
  if(user) {
    setOnlineStatus(user.uid, false);
    setTimeout(() => { auth.signOut(); }, 300);
  }
}

function loadData() {
  db.collection('eliteData').doc('playersData').onSnapshot(doc => { if(doc.exists) { playersDb = doc.data().list || []; renderRoster(); if(currentScreen==='newGame') renderNewGame(); }});
  db.collection('eliteGames').onSnapshot(snap => {
    savedGames = []; snap.forEach(d => savedGames.push(d.data()));
    if(state) { let s = savedGames.find(g => g.id === state.id); if(s) { state = s; renderActive(); } else { state = null; showScreen('continue'); } }
    if(currentScreen==='continue') renderContinue();
    if(currentScreen==='history') renderHistory();
    if(currentScreen==='reports') renderReports();
  });
}

function renderRoster() {
  const c = document.getElementById('sidebarRoster'); if(!c) return; c.innerHTML = "";
  playersDb.sort((a,b)=>a.fullName.localeCompare(b.fullName)).forEach(p => {
    const dotClass = p.isOnline ? 'dot-online' : 'dot-offline';
    c.innerHTML += `<div class="roster-item" onclick="viewProfile('${p.fullName.replace(/'/g, "\\'")}')">
        <div class="status-dot ${dotClass}"></div> ${p.fullName}
    </div>`;
  });
}

function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value).catch(e => alert(e.message)); }
function signup() {
  const f = document.getElementById('signupFirst').value, l = document.getElementById('signupLast').value, e = document.getElementById('signupEmail').value, p = document.getElementById('signupPass').value, c = document.getElementById('signupConfirm').value, v = document.getElementById('signupViking').value, g = document.getElementById('signupGender').value;
  if(p !== c) return alert("Passwords do not match!");
  auth.createUserWithEmailAndPassword(e, p).then(cred => {
    const name = (f + " " + l).toUpperCase();
    playersDb.push({ id: cred.user.uid, fullName: name, vikingName: v, gender: g, isOnline: true });
    db.collection('eliteData').doc('playersData').set({ list: playersDb });
  }).catch(err => alert(err.message));
}

function showScreen(s) {
  currentScreen = s;
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active-nav'));
  document.getElementById('rhsPane').style.display='none';
  if(s==='newGame') { document.getElementById('navNewGame').classList.add('active-nav'); renderNewGame(); }
  if(s==='continue') { document.getElementById('navContinue').classList.add('active-nav'); renderContinue(); }
  if(s==='history') { document.getElementById('navHistory').classList.add('active-nav'); renderHistory(); }
  if(s==='reports') { document.getElementById('navReports').classList.add('active-nav'); renderReports(); }
}

function getPlayerOptionsHtml(currentSelected) {
  let opts = `<option value="">-- Choose Warrior --</option>`;
  playersDb.forEach(p => { if(!currentSelected.includes(p.fullName)) { opts += `<option value="${p.fullName}">${p.fullName}</option>`; } });
  return opts;
}

function renderNewGame() {
  const gInput = document.getElementById('gName');
  const isLocked = gInput && gInput.value.includes('(');
  document.getElementById('mainPane').innerHTML = `
    <h2>Commence Raid</h2>
    <div class="game-card" style="display:block; padding:25px; border-radius:15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="gName" class="bigInput game-name-box" placeholder="War Name (e.g. Muscat Clash)" style="margin-bottom:0; flex:1;" oninput="refreshDropdowns()">
            <button id="timeBtn" class="navBtn" style="background:rgba(255,255,255,0.1); width:auto; padding:0 20px; border-radius:10px;" onclick="appendDateTime()" ${isLocked?'disabled':''}>🕒</button>
        </div>
        <div id="selArea">
            <select class="bigSelect p-sel" onchange="refreshDropdowns()">${getPlayerOptionsHtml([])}</select>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="navBtn" style="background:rgba(0,230,118,0.1); color:#00e676; flex:1; text-align:center;" onclick="addSlot()">+ Add Player</button>
            <button class="authBtn loginBtn" style="margin:0; flex:1.5;" onclick="startMatch()">Begin Raid</button>
        </div>
    </div>`;
}

function refreshDropdowns() {
    const gInput = document.getElementById('gName');
    const timeBtn = document.getElementById('timeBtn');
    if (gInput && timeBtn && !gInput.value.includes('(')) { timeBtn.disabled = false; }
    const selects = Array.from(document.querySelectorAll('.p-sel'));
    const selected = selects.map(s => s.value).filter(v => v !== "");
    selects.forEach(s => {
        const val = s.value;
        const otherSelected = selected.filter(v => v !== val);
        s.innerHTML = getPlayerOptionsHtml(otherSelected);
        s.value = val;
    });
}

function addSlot() {
  const selected = Array.from(document.querySelectorAll('.p-sel')).map(s => s.value);
  const div = document.createElement('div'); div.style="display:flex; gap:8px; margin-bottom:10px;";
  div.innerHTML = `<select class="bigSelect p-sel" style="margin-bottom:0;" onchange="refreshDropdowns()">${getPlayerOptionsHtml(selected)}</select><button onclick="this.parentElement.remove(); refreshDropdowns();" style="width:50px; background:var(--btn-fc); color:white; border-radius:10px;">✕</button>`;
  document.getElementById('selArea').appendChild(div);
}

function appendDateTime() {
    const gInput = document.getElementById('gName');
    const now = new Date();
    const dt = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    gInput.value = gInput.value + " (" + dt + ")";
    document.getElementById('timeBtn').disabled = true;
}

function startMatch() {
  const players = Array.from(document.querySelectorAll('.p-sel')).map(s => s.value).filter(val => v => v !== "");
  if(players.length < 2) return alert("A raid requires at least 2 warriors.");
  state = { id: Date.now().toString(), name: document.getElementById('gName').value||"Ancient Battle", players, totals: {}, round: 1, history: [], eliminated: {}, reentered: {}, winner: null, actionStats: {} };
  players.forEach(p => { state.totals[p]=0; state.eliminated[p]=false; state.reentered[p]=false; state.actionStats[p] = { shows: 0, fcs: 0, drops: 0, mds: 0, outs: 0 }; });
  db.collection('eliteGames').doc(state.id).set(state);
  renderActive();
}

function renderActive() {
  document.getElementById('rhsPane').style.display='block';
  let html = `<h2 style="font-size:20px; margin:0 0 15px 0; color:var(--btn-show);">${state.name}</h2><table><tr><th>Warrior</th><th>Tactics</th><th>Pts</th></tr>`;
  state.players.forEach(p => {
    let isOut = state.totals[p] >= 240;
    html += `<tr class="${isOut?'eliminated':''}">
      <td><b>${p.split(' ')[0]}</b><br><div style="display:flex; gap:5px; margin-top:8px;"><input type="number" id="manual-${p}" class="score-input" placeholder="0"><button style="background:rgba(255,255,255,0.1); padding:5px 12px;" onclick="scoreManual('${p}')">+</button></div></td>
      <td>
        <div style="display:flex; flex-wrap:wrap; gap:4px;">
            <button style="background:var(--btn-show)" onclick="score('${p}',0,'shows')" ${isOut?'disabled':''}>S</button>
            <button style="background:var(--btn-drop)" onclick="score('${p}',20,'drops')" ${isOut?'disabled':''}>D</button>
            <button style="background:var(--btn-md)" onclick="score('${p}',40,'mds')" ${isOut?'disabled':''}>MD</button>
            <button style="background:var(--btn-fc); color:white;" onclick="score('${p}',80,'fcs')" ${isOut?'disabled':''}>F</button>
        </div>
        ${(isOut && !state.reentered[p]) ? `<button style="background:var(--btn-md); width:100%; margin-top:8px; padding:10px;" onclick="reenter('${p}')">RE-ENTER</button>` : ''}
      </td>
      <td><h3 style="margin:0">${state.totals[p]}</h3></td>
    </tr>`;
  });
  html += `</table><button class="bigBtn" style="margin-top:20px;" onclick="nextRound()">End Round</button>`;
  document.getElementById('mainPane').innerHTML = html;
  renderHistoryPane();
}

function score(p, val, type) { 
    state.totals[p] += val; if(type) state.actionStats[p][type]++; 
    if(state.totals[p] >= 240) { state.eliminated[p] = true; state.actionStats[p].outs++; } 
    db.collection('eliteGames').doc(state.id).set(state); 
}
function scoreManual(p) { let val = parseInt(document.getElementById(`manual-${p}`).value) || 0; score(p, val); document.getElementById(`manual-${p}`).value = ""; }
function reenter(p) {
  let max = 0; state.players.forEach(player => { if(state.totals[player] < 240 && state.totals[player] > max) max = state.totals[player]; });
  state.totals[p] = max + 1; state.eliminated[p] = false; state.reentered[p] = true; db.collection('eliteGames').doc(state.id).set(state);
}

function nextRound() {
  state.history.push({ round: state.round, totals: {...state.totals} });
  state.round++;
  let active = state.players.filter(p => state.totals[p] < 240);
  if(active.length === 1) state.winner = active[0];
  db.collection('eliteGames').doc(state.id).set(state);
}

function viewProfile(name) {
    const pData = playersDb.find(x => x.fullName === name);
    if(!pData) return;
    document.getElementById('profName').innerText = name;
    document.getElementById('profViking').innerText = pData.vikingName || "Ancient Warrior";
    const style = (pData.gender === 'female') ? 'lorelei' : 'lorelei-neutral';
    document.getElementById('profAvatar').src = `https://api.dicebear.com/7.x/${style}/svg?seed=${name}&mood=happy`;
    
    let finished = savedGames.filter(g => g.winner);
    let myGames = finished.filter(g => g.players.includes(name));
    let wins = finished.filter(g => g.winner === name).length;
    let s=0, f=0, d=0, m=0, o=0;
    myGames.forEach(g => { if(g.actionStats && g.actionStats[name]) { s += g.actionStats[name].shows || 0; f += g.actionStats[name].fcs || 0; d += g.actionStats[name].drops || 0; m += g.actionStats[name].mds || 0; o += g.actionStats[name].outs || 0; }});
    document.getElementById('statPlayed').innerText = myGames.length;
    document.getElementById('statWon').innerText = wins;
    document.getElementById('statShows').innerText = s;
    document.getElementById('statDrops').innerText = d;
    document.getElementById('statMds').innerText = m;
    document.getElementById('statFcs').innerText = f;
    document.getElementById('statOuts').innerText = o;
    let r = "Fate is unfolding...";
    if(myGames.length > 0) { if(s > (d+m)) r = name + " is a bold fighter who thrives on the Show. Valhalla welcomes their spirit."; else if((d+m) > s) r = name + " is a master of tactical drops. Patience of a wolf on the hunt."; else r = "A balanced warrior across the nine realms."; }
    document.getElementById('aiReport').innerText = "AI WARRIOR INSIGHT: " + r;
    openModal('profileModal');
}

function viewMyProfile() { if(auth.currentUser) { const me = playersDb.find(p => p.id === auth.currentUser.uid); if(me) viewProfile(me.fullName); } }
function uiGenerateViking() { const pre = ["Thor", "Bjorn", "Ragnar", "Ivar", "Erik"]; const post = ["Ironside", "Bloodaxe", "Storm", "Wolf", "Red"]; document.getElementById('signupViking').value = pre[Math.floor(Math.random()*pre.length)] + " " + post[Math.floor(Math.random()*post.length)]; }

function renderReports() {
  let html = `<h2>Glory Leaderboard</h2><table><tr><th>Warrior</th><th>Win %</th><th>Purge</th></tr>`;
  playersDb.forEach(p => {
    let myGames = savedGames.filter(g => g.winner && g.players.includes(p.fullName));
    let wins = savedGames.filter(g => g.winner === p.fullName).length;
    html += `<tr><td><b>${p.fullName}</b></td><td>${myGames.length?((wins/myGames.length)*100).toFixed(1):0}%</td><td><button style="background:var(--btn-fc); color:white; padding:5px 10px;" onclick="purgePlayer('${p.id}')">🗑️</button></td></tr>`;
  });
  document.getElementById('mainPane').innerHTML = html + `</table>`;
}

function purgePlayer(uid) { if(confirm("Expel this soul from the horde list?")) { let newList = playersDb.filter(p => p.id !== uid); db.collection('eliteData').doc('playersData').set({ list: newList }); } }

function renderContinue() {
  let active = savedGames.filter(g => !g.winner);
  document.getElementById('mainPane').innerHTML = "<h2>Active Raids</h2>" + active.map(g => `<div class="game-card"><div><b>${g.name}</b></div><button class="navBtn active-nav" style="width:auto;" onclick="resume('${g.id}')">Resume Raid</button></div>`).join('');
}
function resume(id) { state = savedGames.find(g => g.id === id); renderActive(); }
function renderHistory() {
  let finished = savedGames.filter(g => g.winner);
  document.getElementById('mainPane').innerHTML = "<h2>Hall of Fame</h2>" + finished.map(g => `<div class="game-card"><div><b>${g.name}</b><br>Victor: ${g.winner}</div></div>`).join('');
}
function renderHistoryPane() {
  let h = "<h3>Battle Chronicles</h3>";
  state.history.forEach(r => h += `<div style="font-size:11px; margin-bottom:5px; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px;">R${r.round}: ${JSON.stringify(r.totals).replace(/[{}"]/g,'')}</div>`);
  document.getElementById('rhsPane').innerHTML = h;
}
function toggleAuthView(v) { document.getElementById('loginView').style.display = v==='login'?'block':'none'; document.getElementById('signupView').style.display = v==='signup'?'block':'none'; if(v==='signup') uiGenerateViking(); }
</script>
</body>
</html>
