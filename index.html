<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --panel-bg: rgba(20, 30, 40, 0.92);
    --sidebar-bg: rgba(11, 22, 28, 0.95);
    --btn-show: #00e676;
    --btn-fc: #ff5252;
    --btn-drop: #ff9800;
    --btn-md: #ffc107;
    --btn-out: #9c27b0;
    --text-light: #ffffff;
  }

  body { 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: var(--text-light); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1541278107931-e006523892df?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* Layout Structure */
  .app-wrapper { display: flex; flex-direction: row; height: 100vh; width: 100vw; overflow: hidden; backdrop-filter: blur(5px); }
  .left-sidebar { width: 170px; background: var(--sidebar-bg); padding: 15px; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; z-index: 10; overflow-y: auto;}
  .content-area { display: flex; flex: 1; overflow: hidden; }
  .main-pane { flex: 2; padding: 20px 30px; overflow-y: auto; }
  .rhs-pane { flex: 1; min-width: 350px; background: var(--panel-bg); padding: 20px; border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow-y: auto; }

  /* Typography & Elements */
  h1, h2, h3, h4 { margin-top: 0; }
  .bigInput, .bigSelect { width: 100%; padding: 15px; margin-bottom: 10px; font-size: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.6); color: white; box-sizing: border-box; backdrop-filter: blur(10px);}
  .bigInput:focus, .bigSelect:focus { outline: 2px solid var(--btn-show); border-color: transparent;}
  
  .manual-input { width: 55px; padding: 6px; margin: 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.6); color: white; font-size: 13px; text-align: center; }
  .manual-input::-webkit-outer-spin-button, .manual-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  button { padding: 8px 10px; margin: 2px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: #111; transition: transform 0.1s, opacity 0.2s; }
  button:hover:not(:disabled) { transform: scale(1.05); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  .navBtn { width: 100%; margin-bottom: 10px; background: rgba(255,255,255,0.1); color: white; padding: 15px 10px; font-size: 15px; border: 1px solid transparent;}
  .navBtn:hover { background: rgba(255,255,255,0.2); }
  .navBtn.active-nav { background: var(--btn-show); color: #111; outline: none; }
  
  .bigBtn { width: 100%; margin: 10px 0; font-size: 18px; padding: 15px; color: #111; background: var(--btn-show); }
  .googleBtn { background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; border: 1px solid #ddd; }
  .actionBtn { width: auto; color: #111; }
  .timeBtn { background: rgba(255,255,255,0.1); color: white; font-size: 14px; padding: 15px 12px; margin-bottom: 10px; border-radius: 8px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2);}
  .deleteBtn { background: #ff5252; color: white; }
  .resumeBtn { background: #00e676; color: #111; }
  .pdfBtn { background: #e74c3c; color: white; width: 100%; margin-top: 20px; padding: 15px; font-size: 18px;}

  /* Action Buttons */
  .show { background: var(--btn-show); } .fc { background: var(--btn-fc); } .drop { background: var(--btn-drop); } .md { background: var(--btn-md); } .out { background: var(--btn-out); color: white;} .util { background: rgba(255,255,255,0.2); color: white; }
  button.active { outline: 3px solid white; box-shadow: 0 0 15px white;}

  /* Player States */
  .eliminated { opacity: 0.4; text-decoration: line-through; background: rgba(255,0,0,0.1); }
  .locked { opacity: 0.5; }
  .dealer-row td { border-bottom: 2px solid var(--btn-show); }

  /* Compacted Tables */
  .table-responsive { width: 100%; overflow-x: auto; border-radius: 8px; margin-top: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);}
  table { width: 100%; border-collapse: collapse; white-space: nowrap; }
  td, th { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px;}
  th { background: rgba(0,0,0,0.6); color: #aaa; font-weight: normal; text-transform: uppercase; letter-spacing: 1px;}
  h2 { margin-bottom: 5px; font-size: 1.6em; }

  /* Utilities */
  .dealer-badge { background: var(--btn-show); color: #111; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 8px; text-transform: uppercase;}
  .reentry-badge { color: #ffc107; font-size: 10px; font-weight: bold; margin-top: 4px; display: inline-block; text-transform: uppercase;}
  .flex-row { display: flex; justify-content: space-between; align-items: center; }
  .game-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
  
  /* Footer & Auth Styling */
  .app-footer { margin-top: auto; text-align: center; font-size: 11px; color: #888; line-height: 1.5; padding-top: 20px; }
  #authScreen { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 1000;}
  .auth-box { background: var(--panel-bg); padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(20px); max-height: 90vh; overflow-y: auto;}
  .toggle-link { color: var(--btn-show); cursor: pointer; font-size: 14px; text-decoration: underline; display: inline-block; margin-top: 15px; }

  /* Mobile responsiveness */
  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow: auto; height: auto;}
    .left-sidebar { width: auto; flex-direction: row; flex-wrap: wrap; justify-content: space-around; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px; }
    .navBtn { margin-bottom: 5px; margin-right: 5px; flex: 1 1 30%; font-size: 13px;}
    .content-area { flex-direction: column; overflow: visible;}
    .rhs-pane { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
    .app-footer { width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);}
  }
</style>
</head>
<body>

<!-- AUTHENTICATION SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--btn-show); margin-bottom:5px; font-size: 28px;">Elite Rummy</h1>
    <p style="color:#aaa; margin-bottom: 25px; margin-top:0;">Secure League Portal</p>
    
    <!-- LOGIN VIEW -->
    <div id="loginView">
      <input id="loginEmail" class="bigInput" type="email" placeholder="Email Address">
      <input id="loginPassword" class="bigInput" type="password" placeholder="Password">
      <button class="bigBtn" onclick="login()">Log In</button>
      
      <div style="margin: 20px 0; display: flex; align-items: center; color: #888;">
        <hr style="flex: 1; border: 0; border-top: 1px solid #555;">
        <span style="padding: 0 10px; font-size: 12px;">OR</span>
        <hr style="flex: 1; border: 0; border-top: 1px solid #555;">
      </div>
      
      <button class="bigBtn googleBtn" onclick="googleLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" height="20">
        Sign in with Google
      </button>

      <a class="toggle-link" onclick="toggleAuthView('signup')">Create a new account</a>
      
      <!-- Developer Quick Login -->
      <button style="background:transparent; border:1px dashed #666; color:#888; width:100%; padding:10px; margin-top:25px; font-size:12px; cursor:pointer;" onclick="devLogin()">🛠 Developer Quick Login</button>
    </div>

    <!-- SIGNUP VIEW (Hidden by default) -->
    <div id="signupView" style="display: none;">
      
      <div style="display:flex; gap:10px; margin-bottom: 10px;">
        <input id="signupFirstName" class="bigInput" style="margin-bottom:0; padding:12px;" type="text" placeholder="First Name">
        <input id="signupSurname" class="bigInput" style="margin-bottom:0; padding:12px;" type="text" placeholder="Surname">
      </div>
      
      <!-- Viking Name Generator -->
      <div style="display:flex; gap:10px; margin-bottom: 10px;">
        <input id="signupVikingName" class="bigInput" style="margin-bottom:0; padding:12px; background: rgba(0,230,118,0.1); color: var(--btn-show); border: 1px solid var(--btn-show);" type="text" placeholder="Viking Name" readonly>
        <button class="actionBtn util" style="margin:0; width: 60px; font-size: 20px; background: rgba(255,255,255,0.1);" onclick="uiGenerateVikingName()" title="Roll new Viking name">🎲</button>
      </div>

      <input id="signupEmail" class="bigInput" style="padding:12px;" type="email" placeholder="Email Address">
      <input id="signupPassword" class="bigInput" style="padding:12px;" type="password" placeholder="Create Password (min 6 chars)">
      <input id="signupConfirm" class="bigInput" style="padding:12px;" type="password" placeholder="Confirm Password">
      
      <button class="bigBtn" onclick="signup()">Enter Valhalla (Sign Up)</button>
      
      <div style="margin: 15px 0; display: flex; align-items: center; color: #888;">
        <hr style="flex: 1; border: 0; border-top: 1px solid #555;">
        <span style="padding: 0 10px; font-size: 12px;">OR</span>
        <hr style="flex: 1; border: 0; border-top: 1px solid #555;">
      </div>

      <button class="bigBtn googleBtn" onclick="googleLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" height="20">
        Sign in with Google
      </button>

      <a class="toggle-link" onclick="toggleAuthView('login')">Already have an account? Log In</a>
    </div>

    <p id="authError" style="color:#ff5252; font-size:14px; margin-top:15px; min-height: 20px;"></p>
  </div>
</div>

<!-- MAIN APP (Hidden until logged in) -->
<div class="app-wrapper" id="mainApp" style="display: none;">
  <!-- Left Navigation Sidebar -->
  <div class="left-sidebar">
    <div>
      <h2 style="color:var(--btn-show); margin-bottom: 20px; text-align:center; font-size:18px;">Elite Rummy</h2>
      <button id="navNewGame" class="navBtn active-nav" onclick="showScreen('newGame')">New Game</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Continue Game</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
    </div>
    <div class="app-footer">
      <button class="deleteBtn" style="width:100%; padding:10px; margin-bottom:15px;" onclick="logout()">Log Out</button>
      Developers Elite IT<br>Copyright 2026<br>
      App Version: 8 (May '26)
    </div>
  </div>

  <!-- Content Area -->
  <div class="content-area">
    <div class="main-pane" id="mainPane"></div>
    <div class="rhs-pane" id="rhsPane" style="display: none;"></div>
  </div>
</div>

<script>
/* =========================================
   FIREBASE CONFIGURATION
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8",
  measurementId: "G-D5Z38J9JMC"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* =========================================
   VIKING NAME GENERATOR
========================================= */
function generateVikingNameString() {
  const prefixes = ["Thor", "Ragnar", "Bjorn", "Ivar", "Floki", "Lagertha", "Sigurd", "Harald", "Rollo", "Erik", "Leif", "Freya", "Astrid", "Gunnar", "Odin"];
  const suffixes = ["Bloodaxe", "Ironside", "Lothbrok", "Snake-in-the-Eye", "Finehair", "the Red", "the Wise", "Shieldmaiden", "Bearslayer", "Stormbringer", "Wolf", "Thunder"];
  
  const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
  const randomSuffix = suffixes[Math.floor(Math.random() * suffixes.length)];
  return `${randomPrefix} ${randomSuffix}`;
}

function uiGenerateVikingName() {
  document.getElementById('signupVikingName').value = generateVikingNameString();
}

/* =========================================
   AUTHENTICATION LOGIC
========================================= */
const authScreen = document.getElementById('authScreen');
const mainApp = document.getElementById('mainApp');
const authError = document.getElementById('authError');

function toggleAuthView(view) {
  authError.innerText = ""; 
  if (view === 'signup') {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('signupView').style.display = 'block';
    uiGenerateVikingName(); 
  } else {
    document.getElementById('signupView').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
  }
}

auth.onAuthStateChanged((user) => {
  if (user) {
    authScreen.style.display = 'none';
    mainApp.style.display = 'flex';
    loadCloudData(); 
  } else {
    authScreen.style.display = 'flex';
    mainApp.style.display = 'none';
  }
});

function validateEmail(email) {
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return re.test(email);
}

function login() {
  let e = document.getElementById('loginEmail').value.trim();
  let p = document.getElementById('loginPassword').value.trim();
  
  if (!validateEmail(e)) { authError.innerText = "Please enter a valid email address."; return; }
  
  authError.innerText = "Logging in...";
  auth.signInWithEmailAndPassword(e, p).catch(err => {
    authError.innerText = "Invalid Email or Password. Please try again.";
  });
}

function signup() {
  let fName = document.getElementById('signupFirstName').value.trim();
  let lName = document.getElementById('signupSurname').value.trim();
  let vName = document.getElementById('signupVikingName').value.trim();
  let e = document.getElementById('signupEmail').value.trim();
  let p = document.getElementById('signupPassword').value.trim();
  let c = document.getElementById('signupConfirm').value.trim();
  
  if (!fName || !lName) { authError.innerText = "Please enter your First Name and Surname."; return; }
  if (!vName) { authError.innerText = "Please roll a Viking Name!"; return; }
  if (!validateEmail(e)) { authError.innerText = "Please enter a valid email address."; return; }
  if (p.length < 6) { authError.innerText = "Password must be at least 6 characters."; return; }
  if (p !== c) { authError.innerText = "Passwords do not match."; return; }

  authError.innerText = "Forging your account in Valhalla...";
  auth.createUserWithEmailAndPassword(e, p).then((userCredential) => {
    let user = userCredential.user;
    registerUserToDatabase(user.uid, fName, lName, vName, e);
  }).catch(err => {
    if(err.code === 'auth/email-already-in-use') authError.innerText = "This email is already registered.";
    else authError.innerText = err.message;
  });
}

function googleLogin() {
  authError.innerText = "Opening Google Sign-In...";
  const provider = new firebase.auth.GoogleAuthProvider();
  
  auth.signInWithPopup(provider).then((result) => {
    if (result.additionalUserInfo.isNewUser) {
      let user = result.user;
      let nameParts = user.displayName ? user.displayName.split(' ') : ['Google', 'User'];
      let fName = nameParts[0];
      let lName = nameParts.slice(1).join(' ') || '';
      let vName = generateVikingNameString(); 
      
      registerUserToDatabase(user.uid, fName, lName, vName, user.email);
    }
  }).catch((error) => {
    authError.innerText = error.message;
  });
}

function devLogin() {
  authError.innerText = "Authenticating Developer...";
  const devEmail = "admin@elite.com";
  const devPass = "dev123456";

  auth.signInWithEmailAndPassword(devEmail, devPass).catch(err => {
    auth.createUserWithEmailAndPassword(devEmail, devPass).then((userCredential) => {
        registerUserToDatabase(userCredential.user.uid, "Admin", "Developer", "Thor Bug-Smasher", devEmail);
    }).catch(e => {
        authError.innerText = "Dev Login Failed: " + e.message;
    });
  });
}

function logout() {
  auth.signOut();
}

function registerUserToDatabase(uid, fName, lName, vName, email) {
    db.collection('users').doc(uid).set({
      firstName: fName,
      lastName: lName,
      vikingName: vName,
      email: email
    });

    let fullName = (fName + " " + lName).toUpperCase().trim();
    if(!playersDb.find(player => player.fullName === fullName)) {
      playersDb.push({ 
        id: uid, 
        firstName: fName.toUpperCase(), 
        lastName: lName.toUpperCase(), 
        fullName: fullName, 
        vikingName: vName 
      });
      persistPlayers();
    }
}

/* =========================================
   GLOBAL APP DATA & CLOUD SYNC
========================================= */
let savedGames = [];
let playersDb = [];
let state = null; 
let historyStack = []; 
let currentScreen = 'newGame';

const mainPane = document.getElementById('mainPane');
const rhsPane = document.getElementById('rhsPane');

function loadCloudData() {
  // Listen directly to the global database instead of local storage
  db.collection('eliteData').doc('playersData').get().then((doc) => {
    if (doc.exists) playersDb = doc.data().list || [];
    else playersDb = [];
    
    // Automatically re-render options if we are on the new game screen
    if (currentScreen === 'newGame') renderNewGameScreen();
  });

  db.collection('eliteGames').onSnapshot((snapshot) => {
    let newSavedGames = [];
    snapshot.forEach(doc => newSavedGames.push(doc.data()));
    savedGames = newSavedGames;

    if (state && state.id) {
      let updatedState = savedGames.find(g => g.id === state.id);
      if (updatedState) {
        state = updatedState;
        renderActiveGame();
      }
    }

    if(currentScreen === 'continue') renderContinueScreen();
    if(currentScreen === 'history') renderHistoryScreen();
    if(currentScreen === 'reports') renderReportsScreen();
  });

  showScreen('newGame');
}

function persistGames() {
  if (state && state.id) db.collection('eliteGames').doc(state.id).set(state);
}

function persistPlayers() {
  db.collection('eliteData').doc('playersData').set({ list: playersDb });
}

function deleteCloudGame(id) {
  if(confirm("Delete this game from the Cloud permanently?")) {
    db.collection('eliteGames').doc(id).delete();
  }
}

/* =========================================
   HELPER FUNCTIONS
========================================= */
function appendTime(inputId) {
  let input = document.getElementById(inputId);
  if (!input) return;
  let now = new Date();
  let timeString = now.toLocaleDateString() + " - " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  input.value = input.value.trim() !== "" ? input.value.trim() + " (" + timeString + ")" : timeString;
}

function getReentryScore() {
  let activeScores = [...new Set(
    Object.keys(state.totals).filter(p => !state.eliminated[p] && state.totals[p] < 240).map(p => state.totals[p])
  )].sort((a, b) => b - a);

  if (activeScores.length === 0) return 0; 
  let maxScore = activeScores[0];
  if (maxScore >= 239) return (activeScores.length > 1) ? activeScores[1] + 1 : 239; 
  return maxScore + 1;
}

function getPlayerOptionsHtml() {
  let opts = `<option value="">-- Select Player --</option>`;
  playersDb.sort((a,b) => a.fullName.localeCompare(b.fullName)).forEach(p => {
    opts += `<option value="${p.fullName}">${p.fullName}</option>`;
  });
  return opts;
}

/* =========================================
   SCREEN ROUTER
========================================= */
function showScreen(screen) {
  currentScreen = screen;
  document.querySelectorAll('.navBtn').forEach(btn => btn.classList.remove('active-nav'));
  rhsPane.style.display = 'none';
  state = null; historyStack = [];

  if(screen === 'newGame') { document.getElementById('navNewGame').classList.add('active-nav'); renderNewGameScreen(); }
  if(screen === 'continue') { document.getElementById('navContinue').classList.add('active-nav'); renderContinueScreen(); }
  if(screen === 'history') { document.getElementById('navHistory').classList.add('active-nav'); renderHistoryScreen(); }
  if(screen === 'reports') { document.getElementById('navReports').classList.add('active-nav'); renderReportsScreen(); }
}

/* --- 2. NEW GAME SCREEN (Players dynamically loaded here) --- */
function renderNewGameScreen() {
  if(playersDb.length < 2) {
    mainPane.innerHTML = `
      <h2>New Game</h2>
      <div style="background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
        <p style="color:#aaa;">We need at least 2 registered players to start a game.</p>
        <p style="color:var(--btn-show);">Invite your friends to sign up to automatically add them to the roster!</p>
      </div>`;
    return;
  }

  let html = `
    <h2>Start a New Game</h2>
    <div style="background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);">
      <h3 style="color:#aaa;">Game Details</h3>
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="gameNameInput" class="bigInput" placeholder="Enter Game Name" style="margin-bottom:0;">
        <button class="timeBtn" onclick="appendTime('gameNameInput')">🕒 Add Date & Time</button>
      </div>
    </div>
    <div style="background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
      <h3 style="color:#aaa;">Select Players</h3>
      <div id="playersDiv">
        <select class="bigSelect setup-player-select">${getPlayerOptionsHtml()}</select>
        <select class="bigSelect setup-player-select">${getPlayerOptionsHtml()}</select>
      </div>
      <button class="actionBtn util" style="width:100%; padding:15px; font-size:16px; margin-top:10px;" onclick="addSetupPlayerSelect()">+ Add Player Slot</button>
    </div>
    <button class="bigBtn" style="margin-top:20px;" onclick="startNewGame()">Start Game</button>
  `;
  mainPane.innerHTML = html;
}

function addSetupPlayerSelect() {
  let playersDiv = document.getElementById('playersDiv');
  let newSelect = document.createElement('select');
  newSelect.className = 'bigSelect setup-player-select';
  newSelect.innerHTML = getPlayerOptionsHtml();
  playersDiv.appendChild(newSelect);
}

function startNewGame() {
  let gName = document.getElementById('gameNameInput').value.trim() || ("Match " + new Date().toLocaleDateString());
  let players = [];
  
  document.querySelectorAll('.setup-player-select').forEach(sel => {
    let v = sel.value;
    if(v && !players.includes(v)) players.push(v);
  });

  if(players.length < 2) { alert("Please select at least 2 distinct players."); return; }

  state = {
    id: Date.now().toString(), gameName: gName, players: players, totals: {}, roundScores: {},
    eliminated: {}, dropCooldown: {}, hasReentered: {}, round: 1, showPlayer: null, dealerIndex: 0, winner: null, roundHistory: []
  };

  players.forEach(p => { state.totals[p]=0; state.roundScores[p]=0; state.eliminated[p]=false; state.dropCooldown[p]=0; state.hasReentered[p]=false; });
  persistGames(); 
  document.querySelectorAll('.navBtn').forEach(btn => btn.classList.remove('active-nav'));
  renderActiveGame();
}

/* --- 3. CONTINUE / HISTORY SCREENS --- */
function renderContinueScreen() {
  let activeGames = savedGames.filter(g => g.winner === null);
  let html = `<h2>Continue Live Game</h2>`;
  if(activeGames.length === 0) html += `<p style="color:#aaa;">No active games found.</p>`;
  else {
    activeGames.forEach(g => {
      let count = g.players.filter(p => !g.eliminated[p]).length;
      html += `<div class="game-card">
          <div><h3 style="margin-bottom: 5px; color: var(--btn-show);">${g.gameName}</h3><p style="margin: 0; color:#aaa; font-size:14px;">Round ${g.round} • ${count} Players Active</p></div>
          <div><button class="resumeBtn" onclick="resumeGame('${g.id}')">▶ Resume</button><button class="deleteBtn" onclick="deleteCloudGame('${g.id}')">🗑 Delete</button></div>
        </div>`;
    });
  }
  mainPane.innerHTML = html;
}

function renderHistoryScreen() {
  let finishedGames = savedGames.filter(g => g.winner !== null);
  let html = `<h2>Completed Games</h2>`;
  if(finishedGames.length === 0) html += `<p style="color:#aaa;">No games have been completed yet.</p>`;
  else {
    finishedGames.forEach(g => {
      html += `<div class="game-card">
          <div>
            <h3 style="margin-bottom: 5px; color: var(--btn-show);">${g.gameName}</h3>
            <p style="margin: 0; color:#aaa; font-size:14px;">Winner: 🏆 <strong style="color:white;">${g.winner}</strong> • Rounds: ${g.round - 1}</p>
          </div>
          <div><button class="util" onclick="viewGameReport('${g.id}')">View Report</button><button class="deleteBtn" onclick="deleteCloudGame('${g.id}')">🗑 Delete</button></div>
        </div>`;
    });
  }
  mainPane.innerHTML = html;
}

function resumeGame(id) {
  state = savedGames.find(g => g.id === id);
  if(state) { document.querySelectorAll('.navBtn').forEach(btn => btn.classList.remove('active-nav')); renderActiveGame(); }
}

/* --- 4. REPORTS / LEADERBOARD --- */
function renderReportsScreen() {
  let html = `<div class="pdf-container">
    <h1 style="color:var(--btn-show); text-align:center;">League Reports</h1>
    <h2>Overall Leaderboard</h2>
    <div class="table-responsive">
    <table><tr><th>Player</th><th>Viking Alias</th><th>Matches Played</th><th>Matches Won</th><th>Win Rate</th></tr>`;
  
  let stats = {};
  playersDb.forEach(p => stats[p.fullName] = { played: 0, won: 0, vName: p.vikingName });
  
  let completedGames = savedGames.filter(g => g.winner !== null);
  completedGames.forEach(g => {
    g.players.forEach(p => { if(stats[p]) stats[p].played++; });
    if(stats[g.winner]) stats[g.winner].won++;
  });

  let sortedPlayers = Object.keys(stats).sort((a,b) => stats[b].won - stats[a].won || stats[b].played - stats[a].played);
  
  sortedPlayers.forEach(pName => {
    let data = stats[pName];
    if(data.played > 0) {
      let rate = ((data.won / data.played) * 100).toFixed(1) + "%";
      html += `<tr><td><strong>${pName}</strong></td><td style="color:#aaa;">${data.vName || '-'}</td><td>${data.played}</td><td style="color:var(--btn-show); font-weight:bold;">${data.won}</td><td>${rate}</td></tr>`;
    }
  });

  html += `</table></div></div><button class="pdfBtn" onclick="window.print()">📄 Export Leaderboard as PDF (Print)</button>`;
  mainPane.innerHTML = html;
}

function viewGameReport(gameId) {
  let g = savedGames.find(g => g.id === gameId);
  if(!g) return;

  let html = `<div class="pdf-container">
    <button class="actionBtn util" onclick="showScreen('history')">← Back to History</button>
    <h1 style="text-align:center; color:var(--btn-show); margin-top:20px;">Game Report: ${g.gameName}</h1>
    <h2 style="text-align:center;">🏆 Winner: ${g.winner}</h2>
    
    <h3>Final Standings</h3>
    <div class="table-responsive">
    <table><tr><th>Player</th><th>Final Score</th><th>Status</th></tr>`;
  
  g.players.forEach(p => {
    let stat = g.eliminated[p] ? 'Eliminated' : 'Winner';
    html += `<tr class="${g.eliminated[p]?'eliminated':''}"><td>${p}</td><td>${g.totals[p]}</td><td style="color:${g.eliminated[p]?'#ff5252':'var(--btn-show)'}; font-weight:bold;">${stat}</td></tr>`;
  });

  html += `</table></div><h3 style="margin-top:30px;">Round-by-Round Breakdown</h3><div class="table-responsive"><table><tr><th>Round</th>`;
  g.players.forEach(p => html += `<th>${p.split(" ")[0]}</th>`);
  html += `</tr>`;

  g.roundHistory.forEach(r => {
    html += `<tr><td>${r.round}</td>`;
    g.players.forEach(p => { html += `<td>${r.scores[p] !== undefined ? r.scores[p] : '-'}</td>`; });
    html += `</tr>`;
  });

  html += `</table></div></div><button class="pdfBtn" onclick="window.print()">📄 Export Game Report as PDF (Print)</button>`;
  mainPane.innerHTML = html;
}

/* --- 5. ACTIVE GAME LOGIC (RHS & MAIN PANE) --- */
function renderActiveGame() {
  currentScreen = 'activeGame';
  rhsPane.style.display = 'flex'; 

  let activePlayers = state.players.filter(p => !state.eliminated[p]);
  if(activePlayers.length === 1 && !state.winner) {
    state.winner = activePlayers[0];
    persistGames();
  }

  let dealerName = state.players[state.dealerIndex];

  let mainHtml = `
    <div class="flex-row" style="margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
      <div><h4 style="color:#aaa; margin:0; font-weight:normal;">Live Match:</h4><h2 style="margin:0; color:var(--btn-show);">${state.gameName}</h2></div>
      <div><button class="util" onclick="goBack()">Undo Last Click</button></div>
    </div>
    <div class="flex-row" style="margin-top: 15px;"><h2>Round ${state.round}</h2></div>
    
    ${state.winner ? `
      <div style="text-align:center; padding: 20px; background: rgba(0,230,118,0.2); border: 1px solid var(--btn-show); border-radius: 8px; margin-bottom:20px;">
        <h2 style="color:white; font-size: 2em; margin:0;">🏆 ${state.winner} WINS! 🏆</h2>
        <button class="bigBtn" style="width:auto; padding:10px 30px; margin-top:15px; background:white; color:#111;" onclick="viewGameReport('${state.id}')">View Final Game Report</button>
      </div>` : ''}

    <div class="table-responsive">
    <table><tr><th>Player</th><th>Actions</th><th>Round</th><th>Total</th></tr>`;

  state.players.forEach(p => {
    let isOut = state.eliminated[p]; let isDealer = (p === dealerName) && !state.winner; let locked = state.winner !== null;
    mainHtml += `<tr class="${isOut ? 'eliminated' : ''} ${isDealer ? 'dealer-row' : ''}">
        <td><strong style="font-size:16px;">${p}</strong>${isDealer ? '<br><span class="dealer-badge">Serves Cards</span>' : ''}${state.hasReentered[p] && !isOut ? '<br><span class="reentry-badge">★ RE-ENTERED</span>' : ''}${isOut ? '<br><span style="color:#ff5252; font-size:12px; font-weight:bold;">ELIMINATED</span>' : ''}</td>
        <td style="white-space: nowrap;">
          <button class="actionBtn show ${state.showPlayer===p ? 'active' : ''}" ${isOut||locked?'disabled':''} onclick="actionScore('${p}', 'SHOW')">SHOW</button>
          <button class="actionBtn fc" ${isOut||locked?'disabled':''} onclick="actionScore('${p}', 80)">FC</button>
          <button class="actionBtn drop" ${state.dropCooldown[p]!==0||isOut||locked?'disabled':''} onclick="actionScore('${p}', 'DROP')">DROP</button>
          <button class="actionBtn md" ${isOut||locked?'disabled':''} onclick="actionScore('${p}', 40)">MID</button>
          <button class="actionBtn out" ${isOut||locked?'disabled':''} onclick="actionScore('${p}', 'OUT')">OUT</button>
          <span style="display:inline-block; border-left:1px solid rgba(255,255,255,0.2); padding-left:4px; margin-left:4px;">
            <input type="number" id="manual_score_${p.replace(/\s+/g,'_')}" class="manual-input" placeholder="Pts" ${isOut||locked?'disabled':''}>
            <button class="actionBtn util" ${isOut||locked?'disabled':''} onclick="actionManual('${p}')">+</button>
          </span>
        </td>
        <td><strong style="font-size:18px;">${state.roundScores[p]}</strong></td><td><h2 style="margin:0; font-size:24px;">${state.totals[p]}</h2></td>
      </tr>`;
  });

  mainHtml += `</table></div>`;
  if(!state.winner) mainHtml += `<button class="bigBtn" style="margin-top: 20px;" onclick="nextRound()">End Round & Calculate</button>`;
  
  mainPane.innerHTML = mainHtml;
  renderRHS();
}

function actionScore(p, type) {
  if (state.showPlayer === p && type !== 'SHOW') return;
  historyStack.push(JSON.stringify(state));
  
  if (type === 'SHOW') {
    if(state.showPlayer && state.showPlayer !== p) { historyStack.pop(); alert("Only one Show."); return; }
    state.showPlayer = p; state.totals[p] -= state.roundScores[p]; state.roundScores[p] = 0;
  } else if (type === 'DROP') {
    state.totals[p] -= state.roundScores[p]; state.roundScores[p] = 20; state.totals[p] += 20; state.dropCooldown[p] = 1;
  } else if (type === 'OUT') {
    if(state.eliminated[p]) { historyStack.pop(); return; }
    state.totals[p] -= state.roundScores[p]; state.totals[p] += 240; state.roundScores[p] = 240; state.eliminated[p] = true;
    setTimeout(() => promptReentry(p), 10);
  } else {
    state.totals[p] -= state.roundScores[p]; state.roundScores[p] = type; state.totals[p] += type;
  }
  
  persistGames(); 
}

function actionManual(p) {
  let val = parseInt(document.getElementById("manual_score_" + p.replace(/\s+/g,'_')).value);
  if (isNaN(val) || val < 0) { alert("Enter positive number."); return; }
  actionScore(p, val);
}

function promptReentry(p) {
  if (!state.hasReentered[p]) {
    if (confirm(`${p} took an OUT! Do they want to RE-ENTER? (Once per game)`)) {
      state.totals[p] = getReentryScore(); state.eliminated[p] = false; state.roundScores[p] = 0; state.dropCooldown[p] = 0; state.hasReentered[p] = true; 
    }
  } else alert(`${p} is permanently eliminated (re-entry used).`);
  persistGames(); 
}

function nextRound() {
  let active = state.players.filter(p => !state.eliminated[p]);
  if(!state.showPlayer && active.length > 1) { alert("Select Show."); return; }

  state.roundHistory.push({ round: state.round, scores: { ...state.roundScores } });
  historyStack.push(JSON.stringify(state));

  let newlyEliminated = [];
  state.players.forEach(p => { if(!state.eliminated[p] && state.totals[p] >= 240) { state.eliminated[p] = true; newlyEliminated.push(p); } });

  let sharedReentryScore = getReentryScore();

  newlyEliminated.forEach(p => {
    if (!state.hasReentered[p]) {
      if (confirm(`${p} reached ${state.totals[p]} points! RE-ENTER?`)) {
        state.totals[p] = sharedReentryScore; 
        state.eliminated[p] = false; 
        state.dropCooldown[p] = 0; 
        state.hasReentered[p] = true; 
      }
    } else alert(`${p} reached ${state.totals[p]} points. Permanently eliminated.`);
  });

  state.players.forEach(p => {
    if(state.dropCooldown[p] === 1) state.dropCooldown[p] = 2;
    else if(state.dropCooldown[p] === 2) state.dropCooldown[p] = 0;
    if(!state.eliminated[p]) state.roundScores[p] = 0;
  });

  let activeAfter = state.players.filter(p => !state.eliminated[p]);
  do { state.dealerIndex = (state.dealerIndex + 1) % state.players.length; } while (state.eliminated[state.players[state.dealerIndex]] && activeAfter.length > 1);

  state.showPlayer = null; state.round++;
  persistGames(); 
}

function goBack() {
  if(historyStack.length === 0) { alert("Nothing to undo."); return; }
  state = JSON.parse(historyStack.pop()); persistGames(); 
}

function renderRHS() {
  let html = `<div style="flex:1; overflow-y:auto;"><h3>Score History</h3>`;
  if(state.roundHistory.length === 0) html += "<p style='color:#aaa;'>No rounds completed yet.</p>";
  else {
    html += `<div class="table-responsive"><table><tr><th>Rnd</th>`;
    state.players.forEach(p => html += `<th>${p.split(" ")[0]}</th>`);
    html += `</tr>`;
    state.roundHistory.forEach(r => {
      html += `<tr><td>${r.round}</td>`;
      state.players.forEach(p => html += `<td>${r.scores[p] !== undefined ? r.scores[p] : '-'}</td>`);
      html += `</tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;

  if(!state.winner) {
    html += `<div class="add-player-box" style="margin-top:20px; background: rgba(0,0,0,0.4); padding:15px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);">
        <h4 style="margin-top:0;">Add Late Player</h4>
        <select id="newPlayerName" class="bigSelect" style="padding:10px; margin-bottom:10px;">${getPlayerOptionsHtml()}</select>
        <button class="bigBtn" style="padding:10px; margin:0;" onclick="addLatePlayer()">Join Game</button>
      </div>`;
  }
  rhsPane.innerHTML = html;
}

function addLatePlayer() {
  let newName = document.getElementById('newPlayerName').value;
  if(!newName) { alert("Select a player."); return; }
  if(state.players.includes(newName)) { alert("Player already in game."); return; }

  historyStack.push(JSON.stringify(state));
  state.players.push(newName);
  state.totals[newName] = getReentryScore();
  state.roundScores[newName] = 0;
  state.eliminated[newName] = false;
  state.dropCooldown[newName] = 0;
  state.hasReentered[newName] = false; 

  persistGames();
}
</script>
</body>
</html>
