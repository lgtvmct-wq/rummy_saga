<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Elite Rummy Circle - v43.0</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --primary-bg: #1a252f;
    --accent: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #3498db;
    --text-light: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  body { 
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif; 
    color: var(--text-light); min-height: 100vh;
    background: linear-gradient(rgba(44, 62, 80, 0.9), rgba(44, 62, 80, 0.95)), url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2073&auto=format&fit=crop');
    background-size: cover; background-position: center; background-attachment: fixed;
    overflow-x: hidden;
  }

  #mainApp, #authScreen { display: none; }
  .app-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
  .left-sidebar { width: 260px; background: var(--primary-bg); padding: 25px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
  .main-pane { flex: 3; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  
  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; }
    .left-sidebar { width: 100%; height: auto; padding: 10px; border-right: none; border-bottom: 1px solid var(--glass-border); }
    .nav-section { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: none; }
    .nav-section::-webkit-scrollbar { display: none; }
    .navBtn { min-width: 110px; margin-bottom: 0 !important; font-size: 11px !important; padding: 10px !important; text-align: center !important; }
    .main-pane { padding: 15px; }
    .sidebar-footer { display: none; }
  }

  .std-input { width: 100%; height: 50px; padding: 0 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: #ffffff; color: #333; font-size: 16px; font-weight: 600; box-sizing: border-box; }
  button { padding: 12px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:active { transform: scale(0.95); }
  button:disabled { opacity: 0.2; filter: grayscale(1); }
  
  .tactic-btn { border: 2px solid transparent; flex: 1; padding: 8px 5px; font-size: 11px; }
  .tactic-btn.active { border-color: white; box-shadow: 0 0 10px rgba(255,255,255,0.5); filter: brightness(1.3); }

  .navBtn { width: 100%; margin-bottom: 10px; background: rgba(255,255,255,0.08); color: white; text-align: left; }
  .navBtn.active-nav { background: var(--accent); }
  .actionBtn { background: var(--accent); color: white; width: 100%; height: 50px; font-size: 16px; margin-top: 5px; }

  .dealer-badge { background: var(--warning); color: #000; padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; padding: 8px 5px; color: var(--accent); font-size: 10px; text-transform: uppercase; border-bottom: 2px solid var(--glass-border); }
  td { padding: 8px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
  .modal-card { background: #2c3e50; width: 100%; max-width: 450px; padding: 25px; border-radius: 15px; text-align: center; max-height: 90vh; overflow-y: auto; border: 1px solid var(--glass-border); }

  .avatar-lg { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin: 0 auto 15px auto; display: block; background: #1a252f; }
  .avatar-sm { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); vertical-align: middle; margin-right: 5px; }
  
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
  .stat-item { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
  .stat-val { font-size: 16px; font-weight: bold; color: var(--accent); display: block; }
  .stat-lbl { font-size: 9px; color: #aaa; text-transform: uppercase; }

  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; border: 1px solid rgba(0,0,0,0.2); }
  .online-dot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .offline-dot { background: #95a5a6; }
  .status-text { font-size: 10px; font-weight: bold; text-transform: uppercase; }

  .pause-btn { background: var(--info); color: white; border: 1px solid rgba(255,255,255,0.3); font-size: 11px; padding: 8px 12px; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="modal-card" style="background:#1a252f; width:100%; max-width:400px;">
    <h1 style="color:var(--accent); margin:0;">Elite Rummy Circle</h1>
    <span style="font-size: 10px; opacity: 0.6; display: block; margin-bottom: 20px;">VERSION 43.0</span>
    <div id="loginView">
      <input id="loginEmail" class="std-input" placeholder="Email Address">
      <input id="loginPassword" class="std-input" type="password" placeholder="Password">
      <button class="actionBtn" onclick="login()">Log In</button>
      <button class="actionBtn" style="background:#fff; color:#333; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="googleSignIn()">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18"> Continue with Google
      </button>
      <p onclick="toggleAuthView('signup')" style="margin-top:20px; cursor:pointer; text-decoration:underline; font-size:13px;">Create Account</p>
    </div>
    <div id="signupView" style="display:none">
      <input id="signupFirst" class="std-input" placeholder="First Name">
      <input id="signupLast" class="std-input" placeholder="Last Name">
      <input id="signupEmail" class="std-input" placeholder="Email Address">
      <input id="signupPass" class="std-input" type="password" placeholder="Password">
      <button class="actionBtn" style="background:var(--warning); color:#111;" onclick="signup()">Register</button>
      <p onclick="toggleAuthView('login')" style="margin-top:20px; cursor:pointer; text-decoration:underline; font-size:13px;">Back to Login</p>
    </div>
  </div>
</div>

<div id="reentryModal" class="modal-overlay">
    <div class="modal-card">
        <h2 style="color:var(--warning);">Player Elimination</h2>
        <p id="reentryText"></p>
        <div style="display:flex; gap:10px;">
            <button class="actionBtn" style="background:#555; flex:1;" id="btnReentryNo">Leave</button>
            <button class="actionBtn" style="background:var(--accent); flex:1;" id="btnReentryYes">Re-enter</button>
        </div>
    </div>
</div>

<div id="profileModal" class="modal-overlay">
    <div class="modal-card">
        <img id="pPhoto" class="avatar-lg" src="">
        <h2 id="pName" style="color:var(--accent); margin:0;"></h2>
        <p id="pID" style="font-size:10px; opacity:0.5; margin-bottom:10px;"></p>
        <div class="stat-grid">
            <div class="stat-item"><span class="stat-val" id="statWins">0</span><span class="stat-lbl">Wins</span></div>
            <div class="stat-item"><span class="stat-val" id="statS">0</span><span class="stat-lbl">Shows</span></div>
            <div class="stat-item"><span class="stat-val" id="statFC">0</span><span class="stat-lbl">Full</span></div>
            <div class="stat-item"><span class="stat-val" id="statD">0</span><span class="stat-lbl">Drops</span></div>
            <div class="stat-item"><span class="stat-val" id="statMD">0</span><span class="stat-lbl">Mid</span></div>
            <div class="stat-item"><span class="stat-val" id="statTotal">0</span><span class="stat-lbl">Matches</span></div>
        </div>
        <div id="aiAnalysis" style="background:rgba(39, 174, 96, 0.1); border-left: 4px solid var(--accent); padding:12px; text-align:left; font-size:12px; border-radius:4px; margin-bottom:15px; line-height:1.5;"></div>
        <button id="btnEditProfile" style="background:var(--warning); color:#111; margin-bottom:10px; font-size:12px; display:none;" onclick="openEditProfile()">Edit My Profile</button>
        <button class="actionBtn" onclick="document.getElementById('profileModal').style.display='none'">Close</button>
    </div>
</div>

<div id="editProfileModal" class="modal-overlay">
    <div class="modal-card">
        <h2>Edit Profile</h2>
        <img id="editPhotoPreview" class="avatar-lg" src="">
        <input type="file" id="photoUpload" style="display:none;" onchange="handlePhotoUpload(event)">
        <button onclick="document.getElementById('photoUpload').click()" style="background:var(--warning); margin-bottom:15px;">Change Photo</button>
        <input id="editName" class="std-input" placeholder="Display Name">
        <button class="actionBtn" onclick="saveProfile()">Save Changes</button>
        <button class="actionBtn" style="background:#555; margin-top:10px;" onclick="document.getElementById('editProfileModal').style.display='none'">Cancel</button>
    </div>
</div>

<div id="addMidGameModal" class="modal-overlay">
    <div class="modal-card">
        <h2>Add Player Mid-Game</h2>
        <select id="midGameSelect" class="std-input"></select>
        <button class="actionBtn" onclick="confirmAddMidGame()">Add Now</button>
        <button class="actionBtn" style="background:#555; margin-top:10px;" onclick="document.getElementById('addMidGameModal').style.display='none'">Cancel</button>
    </div>
</div>

<div class="app-wrapper" id="mainApp">
  <div class="left-sidebar">
    <h2 style="color:var(--accent); margin-bottom:15px; margin-top:0;">Elite Circle</h2>
    <div class="nav-section">
      <button id="navNewGame" class="navBtn" onclick="showScreen('newGame')">New Match</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Active</button>
      <button id="navPlayers" class="navBtn" onclick="showScreen('players')">Players</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
      <button class="navBtn" style="background:var(--warning); color:#000;" onclick="viewMyProfile()">My Stats</button>
      <button class="navBtn" style="background:var(--danger);" onclick="handleLogout()">Logout</button>
    </div>
    <div style="margin-top:auto; text-align:center;" class="sidebar-footer">
        <div style="font-size: 10px; opacity: 0.4;">Developed by Elite IT &copy; 2026</div>
    </div>
  </div>
  <div class="main-pane" id="mainPane"></div>
</div>

<script>
// --- FIREBASE INIT ---
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let playersDb =[], savedGames =[], state = null, currentScreen = '';
let isPromptingReEntry = false;

// --- AUTH ---
auth.onAuthStateChanged(user => {
  if(user) {
    document.getElementById('authScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    db.collection('players').doc(user.uid).set({ isOnline: true }, {merge:true});
    loadData();
    if(!currentScreen) showScreen('newGame');
  } else {
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
});

function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); }
async function googleSignIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
async function signup() {
    const cred = await auth.createUserWithEmailAndPassword(document.getElementById('signupEmail').value, document.getElementById('signupPass').value);
    await db.collection('players').doc(cred.user.uid).set({ 
        fullName: (document.getElementById('signupFirst').value + " " + document.getElementById('signupLast').value).toUpperCase(), 
        isOnline: true, photoURL: "", createdAt: firebase.firestore.FieldValue.serverTimestamp() 
    });
}
function handleLogout() { if(auth.currentUser) db.collection('players').doc(auth.currentUser.uid).update({ isOnline: false }).then(() => auth.signOut()); }
function toggleAuthView(v) {
  document.getElementById('loginView').style.display = v==='login'?'block':'none';
  document.getElementById('signupView').style.display = v==='signup'?'block':'none';
}

// --- DATA LISTENER ---
function loadData() {
  db.collection('players').onSnapshot(snap => { playersDb =[]; snap.forEach(doc => playersDb.push({id: doc.id, ...doc.data()})); });
  db.collection('eliteGames').onSnapshot(snap => {
    savedGames =[]; snap.forEach(d => savedGames.push(d.data()));
    if(currentScreen === 'activeGame' && state && !isPromptingReEntry) {
        let s = savedGames.find(g => g.id === state.id);
        if(s) { state = s; renderActive(); } else { state = null; showScreen('newGame'); }
    }
  });
}

// --- NAVIGATION ---
function showScreen(s) {
  currentScreen = s;
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active-nav'));
  const btn = document.getElementById('nav' + s.charAt(0).toUpperCase() + s.slice(1));
  if(btn) btn.classList.add('active-nav');
  if(s==='newGame') renderNewGame();
  if(s==='players') renderPlayers();
  if(s==='continue') renderContinue();
  if(s==='history') renderHistory();
  if(s==='reports') renderReports();
}

// --- VIEWS ---
function renderNewGame() {
  document.getElementById('mainPane').innerHTML = `
    <h2>New Match Setup</h2>
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px;">
        <input id="gName" class="std-input" placeholder="Enter Match Name">
        <button onclick="appendDT()" style="background:var(--warning); width:100%; color:#111; margin-bottom:15px;">🕒 Insert Date/Time</button>
        <div id="playerList"></div>
        <button class="navBtn" style="background:rgba(255,255,255,0.1); width:100%; border:1px dashed var(--glass-border);" onclick="addPlayerField()">+ Add Player</button>
        <button class="actionBtn" onclick="startGame()">Start Random Match</button>
    </div>`;
}

function appendDT() { document.getElementById('gName').value += " " + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function addPlayerField() {
  const selected = Array.from(document.querySelectorAll('#playerList select')).map(s => s.value);
  let opts = `<option value="">-- Select Player --</option>` + 
    playersDb.map(p => {
        if(selected.includes(p.fullName)) return '';
        const name = p.fullName || `Elite-User-${p.id.substring(0,5)}`;
        return `<option value="${name}" ${p.isOnline?'':'disabled'}>${name} ${p.isOnline?'':'(OFFLINE)'}</option>`;
    }).join('');
  const div = document.createElement('div');
  div.style="display:flex; gap:10px; margin-bottom:10px;";
  div.innerHTML = `<select class="std-input" style="margin-bottom:0; flex:1;">${opts}</select><button onclick="this.parentElement.remove()" style="background:var(--danger); width:50px;">✕</button>`;
  document.getElementById('playerList').appendChild(div);
}

function formatEliteDate(dateObj) {
    if (!dateObj) return '-';
    const d = (dateObj instanceof Date) ? dateObj : new Date(dateObj);
    if (isNaN(d.getTime())) return '-';
    
    return d.toLocaleDateString('en-GB') + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
}

function startGame() {
  let pList = Array.from(document.querySelectorAll('#playerList select')).map(s => s.value).filter(v => v !== "");
  if(pList.length < 2) return alert("Select at least 2 players");
  for(let i=pList.length-1; i>0; i--){ let j=Math.floor(Math.random()*(i+1)); [pList[i],pList[j]]=[pList[j],pList[i]]; }
  state = {
    id: Date.now().toString(), name: document.getElementById('gName').value || "Match",
    startTime: formatEliteDate(new Date()), players: pList, totals: {}, roundScores: {}, lastDropRound: {},
    eliminated: {}, reEntries: {}, actionStats: {}, round: 1, history: [], winner: null
  };
  pList.forEach(p => { state.totals[p]=0; state.roundScores[p]=null; state.lastDropRound[p]=-1; state.actionStats[p]={shows:0,fcs:0,drops:0,mds:0}; });
  db.collection('eliteGames').doc(state.id).set(state);
  currentScreen='activeGame';
  renderActive();
}

function renderActive() {
  if(!state) return;
  let dealerIdx = (state.round-1) % state.players.length;
  let dealer = state.players[dealerIdx];

  let h = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin:0;">${state.name}</h3>
    <button onclick="state=null; showScreen('newGame')" class="pause-btn">${state.winner?'Home':'Pause'}</button>
  </div><table style="table-layout: fixed;">
    <colgroup><col style="width:32%"><col style="width:48%"><col style="width:20%"></colgroup>
    <tr><th>Player</th><th>Tactics</th><th>Total</th></tr>`;

  state.players.forEach(p => {
    let rs = state.roundScores[p];
    let isOut = state.eliminated[p] || state.totals[p] >= 240;
    let dLock = state.lastDropRound[p] === (state.round-1);
    let hasReEntered = state.reEntries && state.reEntries[p];

    h += `<tr style="${isOut?'opacity:0.3':''}">
        <td>
            ${p===dealer?'<span class="dealer-badge">D</span>':''} 
            <b>${p}</b>
            ${hasReEntered ? '<span style="background:var(--warning); color:#000; padding:1px 4px; border-radius:3px; font-size:8px; margin-left:4px; font-weight:bold;">RE</span>' : ''}
        </td>
        <td>
            <div style="display:flex; gap:3px; flex-wrap:wrap;">
                <button class="tactic-btn ${rs==='S'?'active':''}" style="background:var(--accent)" onclick="setTactic('${p}', 'S')" ${isOut?'disabled':''}>S</button>
                <button class="tactic-btn ${rs===20?'active':''}" style="background:var(--warning)" onclick="setTactic('${p}', 'D')" ${isOut || dLock?'disabled':''}>D</button>
                <button class="tactic-btn ${rs===40?'active':''}" style="background:#8e44ad; color:white;" onclick="setTactic('${p}', 'MD')" ${isOut?'disabled':''}>MD</button>
                <button class="tactic-btn ${rs===80?'active':''}" style="background:var(--danger); color:white;" onclick="setTactic('${p}', 'FC')" ${isOut?'disabled':''}>FC</button>
                <button style="background:#333; color:white; font-size:10px; border:none; border-radius:4px; padding:5px;" onclick="markOut('${p}')" ${isOut?'disabled':''}>OUT</button>
            </div>
            <input type="text" class="std-input" style="height:35px; margin:5px 0 0 0; text-align:center; font-size:12px; width:100%;" value="${rs===null?'':rs}" onchange="manualInput('${p}', this.value)" ${isOut?'disabled':''}>
        </td>
        <td><b style="color:var(--warning)">${state.totals[p]}</b></td>
    </tr>`;
  });

  if(!state.winner) {
      h += `</table><button id="endBtn" class="actionBtn" style="margin-top:15px;" onclick="nextRound()">Next Round</button>
            <button class="actionBtn" style="background:#555; height:45px; font-size:12px;" onclick="openMidGame()">+ Add Player Mid-Game</button>`;
  } else {
      h += `</table><div style="text-align:center; padding:15px;"><h2 style="color:var(--accent); margin:0;">Winner: ${state.winner}</h2></div>`;
  }
  
  h += `<div style="margin-top: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border:1px solid var(--glass-border);">
        <h4 style="margin: 0 0 10px 0; color:var(--accent);">Scoreboard Logs</h4>`;
  if (state.history.length === 0) h += `<div style="font-size:11px; opacity:0.5;">Waiting for round completion...</div>`;
  else {
      state.history.slice().reverse().forEach(r => {
          h += `<div style="font-size:11px; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:5px;">
              <b style="color:var(--accent);">Round ${r.round}</b>: ${state.players.map(p => {
                  let rs = r.scores[p] === undefined ? '-' : r.scores[p];
                  let tot = r.totals[p] !== undefined ? r.totals[p] : '-';
                  let re = (r.reentries && r.reentries[p]) ? ` <span style="color:var(--warning)">[RE: ${r.reentries[p]}]</span>` : '';
                  return `${p}: ${rs==240||state.eliminated[p]?'OUT':rs+' ('+tot+')'}${re}`;
              }).join(' | ')}
          </div>`;
      });
  }
  h += `</div>`;
  document.getElementById('mainPane').innerHTML = h;
  validateEndBtn();
}

function setTactic(p, type) {
    if(state.winner || state.eliminated[p]) return;
    let v = null;
    if(type==='S'){ state.players.forEach(pl => {if(state.roundScores[pl]==='S') state.roundScores[pl]=null;}); v=(state.roundScores[p]==='S')?null:'S'; }
    else if(type==='D') v=(state.roundScores[p]===20)?null:20;
    else if(type==='MD') v=(state.roundScores[p]===40)?null:40;
    else if(type==='FC') v=(state.roundScores[p]===80)?null:80;
    state.roundScores[p] = v;
    db.collection('eliteGames').doc(state.id).update({ roundScores: state.roundScores });
}

function manualInput(p, val) {
    let v = val.toUpperCase()==='S'?'S':(val===''?null:parseInt(val));
    if(v==='S') state.players.forEach(pl => {if(state.roundScores[pl]==='S') state.roundScores[pl]=null;});
    state.roundScores[p]=v;
    db.collection('eliteGames').doc(state.id).update({ roundScores: state.roundScores });
}

function validateEndBtn() {
    let active = state.players.filter(p => !state.eliminated[p] && state.totals[p] < 240);
    let win = active.filter(p => state.roundScores[p]==='S' || state.roundScores[p]===0);
    let fill = active.every(p => state.roundScores[p]!==null && state.roundScores[p]!=='');
    const btn = document.getElementById('endBtn');
    if(btn) { btn.disabled = !(win.length===1 && fill); btn.style.background = btn.disabled?"#555":"var(--accent)"; }
}

function markOut(p) {
    if(confirm(`Eject ${p} immediately?`)) {
        state.eliminated[p]=true; state.totals[p]=240; state.roundScores[p]=240;
        db.collection('eliteGames').doc(state.id).set(state);
    }
}

async function nextRound() {
    isPromptingReEntry = true;
    let scores = {...state.roundScores};
    let entry = { round: state.round, scores: scores, totals: {}, reentries: {} };
    
    // First calculate the totals for the current round
    state.players.forEach(p => {
        if(!state.eliminated[p]) {
            let n = (scores[p]==='S')?0: (parseInt(scores[p])||0);
            state.totals[p] += n;
            if(scores[p]==='S' || scores[p]===0) state.actionStats[p].shows++;
            if(scores[p]===20) { state.actionStats[p].drops++; state.lastDropRound[p]=state.round; }
            if(scores[p]===40) state.actionStats[p].mds++;
            if(scores[p]===80) state.actionStats[p].fcs++;
        }
    });

    // Check for re-entries
    let activeSurvivors = state.players.filter(p => state.totals[p]<240 && !state.eliminated[p]).map(p => state.totals[p]);
    let entryScore = (activeSurvivors.length > 0 ? Math.max(...activeSurvivors) : 0) + 1;
    
    for(let p of state.players) {
        if(state.totals[p]>=240 && !state.eliminated[p]) {
            if(state.reEntries[p] || entryScore >= 240) {
                state.eliminated[p]=true;
            } else {
                let re = confirm(`${p} reached ${state.totals[p]}. Re-enter at ${entryScore}?`);
                if(re) { 
                    state.reEntries[p] = true; 
                    state.totals[p] = entryScore;
                    entry.reentries[p] = entryScore; // Track re-entry in this round's log
                } else {
                    state.eliminated[p] = true;
                }
            }
        }
    }

    // Capture final totals for this round (post re-entry)
    state.players.forEach(p => {
        entry.totals[p] = state.totals[p];
    });

    state.history.push(entry);
    state.round++; 
    state.players.forEach(p => state.roundScores[p]=null);
    
    let currentWinners = state.players.filter(p => !state.eliminated[p] && state.totals[p]<240);
    if(currentWinners.length === 1) { 
        state.winner=currentWinners[0]; 
        state.endTime=formatEliteDate(new Date()); 
    } else if (currentWinners.length === 0) {
        state.winner = "Draw/No survivors";
        state.endTime = formatEliteDate(new Date());
    }
    
    await db.collection('eliteGames').doc(state.id).set(state);
    isPromptingReEntry=false;
    renderActive();
}

// --- PROFILE & AI ANALYSIS ---
function viewProfile(uid) {
    const p = playersDb.find(x => x.id === uid); if(!p) return;
    const name = p.fullName || `Elite-ID: ${p.id.substring(0,8)}`;
    let matches = savedGames.filter(g => g.winner && g.players.includes(name));
    let wins = matches.filter(g => g.winner === name).length;
    let s=0, fc=0, d=0, md=0;
    matches.forEach(g => { if(g.actionStats[name]){ s+=g.actionStats[name].shows; fc+=g.actionStats[name].fcs; d+=g.actionStats[name].drops; md+=g.actionStats[name].mds; } });
    
    document.getElementById('pPhoto').src = p.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=27ae60&color=fff&size=150`;
    document.getElementById('pName').innerText = name;
    document.getElementById('pID').innerText = "PLAYER ID: " + p.id;
    document.getElementById('statWins').innerText = wins;
    document.getElementById('statS').innerText = s;
    document.getElementById('statFC').innerText = fc;
    document.getElementById('statD').innerText = d;
    document.getElementById('statMD').innerText = md;
    document.getElementById('statTotal').innerText = matches.length;

    let ai = "Insufficient match history to build a realistic strategic profile (Need 3+ matches).";
    if(matches.length >= 3) {
        const dropRatio = (d + md) / matches.length;
        const showRatio = s / matches.length;
        const fullRatio = fc / matches.length;

        if (dropRatio > 1.5 && showRatio < 0.5) ai = "<b>Defensive Strategist:</b> Plays with extreme caution. Prioritizes point preservation through calculated drops. Difficult to eliminate but rarely takes the initiative.";
        else if (showRatio > 1.2) ai = "<b>Aggressive Hunter:</b> High-risk, high-reward player. Hunts for the show early and often. Dominates fast rounds but prone to heavy point hits if caught.";
        else if (fullRatio > 1.0) ai = "<b>Stubborn Competitor:</b> Tendency to hold cards too long. Relies on big hands rather than tactical drops. Vulnerable to fast players.";
        else ai = "<b>Balanced Professional:</b> Adapts seamlessly to the table. Knows exactly when to push for a show and when to fold. A highly versatile and unpredictable opponent.";
    }
    document.getElementById('aiAnalysis').innerHTML = "<b>AI STRATEGIC PROFILE:</b><br>" + ai;
    document.getElementById('btnEditProfile').style.display = (auth.currentUser && uid === auth.currentUser.uid) ? 'inline-block' : 'none';
    document.getElementById('profileModal').style.display='flex';
}

function viewMyProfile() { if(auth.currentUser) viewProfile(auth.currentUser.uid); }

function openEditProfile() {
    const p = playersDb.find(x => x.id === auth.currentUser.uid);
    document.getElementById('editName').value = p.fullName || "";
    document.getElementById('editPhotoPreview').src = p.photoURL || "";
    document.getElementById('profileModal').style.display = 'none';
    document.getElementById('editProfileModal').style.display = 'flex';
}

async function saveProfile() {
    await db.collection('players').doc(auth.currentUser.uid).update({ fullName: document.getElementById('editName').value.toUpperCase(), photoURL: document.getElementById('editPhotoPreview').src });
    document.getElementById('editProfileModal').style.display = 'none';
    viewMyProfile();
}

function handlePhotoUpload(event) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 150;
            const scale = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            document.getElementById('editPhotoPreview').src = canvas.toDataURL('image/jpeg', 0.7);
        }
        img.src = e.target.result;
    };
    reader.readAsDataURL(event.target.files[0]);
}

// --- UTILS & SCREENS ---
function openMidGame() {
    let avail = playersDb.filter(p => !state.players.includes(p.fullName));
    document.getElementById('midGameSelect').innerHTML = `<option value="">-- Select --</option>` + avail.map(p => `<option value="${p.fullName}">${p.fullName}</option>`).join('');
    document.getElementById('addMidGameModal').style.display='flex';
}
async function confirmAddMidGame() {
    let name = document.getElementById('midGameSelect').value; if(!name) return;
    let act = state.players.filter(p => !state.eliminated[p] && state.totals[p]<240).map(p => state.totals[p]);
    let es = (act.length > 0 ? Math.max(...act) : 0) + 1;
    state.players.push(name); state.totals[name]=es; state.roundScores[name]=null; state.actionStats[name]={shows:0,fcs:0,drops:0,mds:0};
    await db.collection('eliteGames').doc(state.id).set(state);
    document.getElementById('addMidGameModal').style.display='none';
}

function renderPlayers() {
    document.getElementById('mainPane').innerHTML = `<h2>Registered Players</h2><table>` + 
        playersDb.map(p => {
            const name = p.fullName || "Undefined Player";
            return `<tr><td>
                <span class="status-dot ${p.isOnline?'online-dot':'offline-dot'}"></span>
                <span class="status-text">${p.isOnline?'Online':'Offline'}</span> | <b>${name}</b>
            </td><td><button onclick="viewProfile('${p.id}')">Profile</button></td></tr>`
        }).join('') + `</table>`;
}

function renderContinue() {
    let act = savedGames.filter(g => !g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Active Games</h2>` + act.map(g => `<div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;"><div><b>${g.name}</b></div><button onclick="resume('${g.id}')">Resume</button></div>`).join('') || `<p>No active games.</p>`;
}
function resume(id) { state=savedGames.find(g => g.id === id); currentScreen='activeGame'; renderActive(); }

function renderHistory() {
    let fin = savedGames.filter(g => g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Match History</h2>` + fin.map(g => `<div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;"><div><b>${g.name}</b><br><small>Winner: ${g.winner}</small></div><button onclick="delMatch('${g.id}')" style="background:var(--danger)">Del</button></div>`).join('');
}
function delMatch(id) { if(confirm("Delete this match?")) db.collection('eliteGames').doc(id).delete(); }

function renderReports() {
    let fin = savedGames.filter(g => g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Game Reports</h2>` + fin.map(g => `
        <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <span style="flex:1;"><b>${g.name}</b><br><small style="opacity:0.6">${g.endTime || ''}</small></span>
            <div style="display:flex; gap:5px;">
                <button onclick="viewTableReport('${g.id}')" style="background:var(--accent); font-size:12px;">Table View</button>
                <button onclick="genPDF('${g.id}')" style="background:var(--info); font-size:12px;">PDF</button>
            </div>
        </div>`).join('');
}

function viewTableReport(id) {
    const g = savedGames.find(x => x.id === id);
    if(!g) return;

    let h = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">Report View</h3>
            <button onclick="showScreen('reports')" class="pause-btn">Back to List</button>
        </div>
        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid var(--glass-border);">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:13px;">
                <div><span style="opacity:0.6">Match Name:</span><br><b>${g.name}</b></div>
                <div><span style="opacity:0.6">Start Time:</span><br><b>${g.startTime || '-'}</b></div>
                <div><span style="opacity:0.6">End Time:</span><br><b>${g.endTime || '-'}</b></div>
                <div><span style="opacity:0.6">Tournament Winner:</span><br><b style="color:var(--accent)">${g.winner}</b></div>
            </div>
        </div>
        <div style="overflow-x:auto; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; border:1px solid var(--glass-border);">
            <table style="min-width:400px;">
                <thead>
                    <tr>
                        <th style="width:50px;">Rnd</th>
                        ${g.players.map(p => `<th>${p}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
    `;

    g.history.filter(r => Object.values(r.scores).some(v => v !== null)).forEach(r => {
        h += `<tr>
            <td style="color:var(--accent); font-weight:bold;">${r.round}</td>
            ${g.players.map(p => {
                let s = r.scores[p];
                let t = r.totals[p];
                let re = (r.reentries && r.reentries[p]);
                
                // Detection if player had not joined yet
                let notJoined = (t === undefined);
                let isOut = (t >= 240 && !re);
                
                let val = "";
                let subVal = "";
                
                if (notJoined) {
                    val = `<span style="opacity:0.4; font-size:10px;">Not Played</span>`;
                    subVal = ""; // No total shown
                } else if (isOut) {
                    val = `<span style="color:var(--danger); font-weight:bold;">OUT</span>`;
                    subVal = `<div style="font-size:10px; opacity:0.6;">Total: ${t}</div>`;
                } else {
                    if (s === 'S') val = `<span style="color:var(--accent); font-weight:bold;">Show</span>`;
                    else if (re) val = `<span style="color:var(--warning); font-weight:bold;">${s}</span>`;
                    else val = (s !== null && s !== undefined) ? s : '-';
                    
                    let totStyle = re ? `color:var(--warning); font-weight:bold;` : `opacity:0.6;`;
                    subVal = `<div style="font-size:10px; ${totStyle}">Total: ${t}</div>`;
                }

                return `<td>
                    <div>${val}</div>
                    ${subVal}
                    ${re ? '<div style="font-size:9px; color:var(--warning); font-weight:bold;">[RE-ENTERED]</div>' : ''}
                </td>`;
            }).join('')}
        </tr>`;
    });

    h += `
                <tr style="background:rgba(255,255,255,0.1); border-top:2px solid var(--accent);">
                    <td style="color:var(--warning); font-weight:bold;">TOTAL</td>
                    ${g.players.map(p => {
                        let isWinner = g.winner === p;
                        return `<td style="color:var(--warning); font-weight:bold;">
                            ${g.totals[p]}
                            ${isWinner ? '<div style="color:var(--accent); font-size:10px; margin-top:2px;">WINNER</div>' : ''}
                        </td>`;
                    }).join('')}
                </tr>
                </tbody>
            </table>
        </div>
    `;

    document.getElementById('mainPane').innerHTML = h;
}

function genPDF(id) {
    const g = savedGames.find(x => x.id === id);
    const doc = new jspdf.jsPDF();
    doc.setFontSize(18);
    doc.text(`Match Report: ${g.name}`, 14, 20);
    doc.setFontSize(10);
    doc.text(`Start: ${g.startTime || '-'}  |  End: ${g.endTime || '-'}`, 14, 28);
    doc.text(`Winner: ${g.winner}`, 14, 34);

    const sigHistory = g.history.filter(r => Object.values(r.scores).some(v => v !== null));
    const body = sigHistory.map(r => [
        r.round, 
        ...g.players.map(p => {
            let s = r.scores[p];
            let t = r.totals[p];
            if (t === undefined) return 'Not Played';
            if (r.reentries && r.reentries[p]) return `${s} (RE)`;
            if (t >= 240) return 'OUT';
            return s === 'S' ? 'Show' : (s === null ? '-' : s);
        })
    ]);
    body.push(['TOTAL', ...g.players.map(p => {
        let isWinner = g.winner === p;
        return g.totals[p] + (isWinner ? ' (Winner)' : '');
    })]);

    doc.autoTable({ 
        head:[['Rnd', ...g.players]], 
        body: body, 
        startY: 40,
        didParseCell: function(data) {
            if (data.row.index < sigHistory.length) {
                const round = sigHistory[data.row.index];
                const player = g.players[data.column.index - 1]; // -1 because first col is 'Rnd'
                if (round && round.reentries && round.reentries[player]) {
                    data.cell.styles.textColor = [243, 156, 18]; // --warning color
                }
            }
        }
    });
    doc.save(`${g.name}.pdf`);
}
</script>
