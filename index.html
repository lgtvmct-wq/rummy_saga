<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --primary: #2c3e50;
    --accent: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --text-light: #ffffff;
    --bg-overlay: rgba(15, 32, 39, 0.95);
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  body { 
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif; 
    color: var(--text-light); min-height: 100vh;
    background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.9)), url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2073&auto=format&fit=crop');
    background-size: cover; background-position: center; background-attachment: fixed;
  }

  #mainApp, #authScreen { display: none; }
  .app-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; backdrop-filter: blur(10px); }
  
  .left-sidebar { width: 260px; background: #1a252f; padding: 25px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
  
  .main-pane { flex: 3; padding: 30px; overflow-y: auto; }
  .rhs-pane { flex: 1.2; min-width: 320px; background: rgba(0,0,0,0.25); padding: 20px; border-left: 1px solid var(--glass-border); overflow-y: auto; }

  /* Standardized Form Elements */
  .standard-input { 
    width: 100%; height: 55px; padding: 0 15px; margin-bottom: 15px; 
    border-radius: 8px; border: 1px solid var(--glass-border); 
    background: #fff; color: #333; font-size: 16px; font-weight: 600; box-sizing: border-box; 
  }

  button { padding: 12px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .navBtn { width: 100%; margin-bottom: 10px; background: rgba(255,255,255,0.08); color: white; text-align: left; }
  .navBtn.active-nav { background: var(--accent); color: white; }
  .actionBtn { background: var(--accent); color: white; width: 100%; font-size: 16px; height: 55px; }

  /* Auth Centering */
  #authScreen { display: flex; position: fixed; inset: 0; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); z-index: 2000; }
  .auth-box { background: var(--bg-overlay); padding: 40px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--glass-border); }

  /* Tables & Lists */
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { text-align: left; padding: 12px; border-bottom: 2px solid var(--glass-border); color: var(--accent); font-size: 12px; text-transform: uppercase; }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  
  .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  .online { background: var(--accent); color: white; }
  .offline { background: #555; color: white; }

  .game-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--glass-border); }

  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow-y: auto; }
    .left-sidebar { width: 100%; height: auto; border-right: none; padding: 15px; }
    .nav-section { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .navBtn { margin-bottom: 0; padding: 10px; font-size: 12px; }
    .rhs-pane { border-left: none; border-top: 1px solid var(--glass-border); }
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--accent); margin-bottom: 30px;">Elite Rummy</h1>
    
    <div id="loginView">
      <input id="loginEmail" class="standard-input" placeholder="Email Address">
      <input id="loginPassword" class="standard-input" type="password" placeholder="Password">
      <button class="actionBtn" onclick="login()">Log In</button>
      <a onclick="toggleAuthView('signup')" style="cursor:pointer; display:block; margin-top:15px; font-size:13px; text-decoration:underline;">Create New Account</a>
    </div>

    <div id="signupView" style="display:none">
      <div style="display:flex; gap:10px;"><input id="signupFirst" class="standard-input" placeholder="First Name"><input id="signupLast" class="standard-input" placeholder="Last Name"></div>
      <div style="text-align:left; font-size:11px; margin-bottom:5px; color:var(--accent);">GENDER</div>
      <select id="signupGender" class="standard-input">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <input id="signupEmail" class="standard-input" placeholder="Email Address">
      <input id="signupPass" class="standard-input" type="password" placeholder="Create Password">
      <input id="signupConfirm" class="standard-input" type="password" placeholder="Confirm Password">
      <button class="actionBtn" style="background:var(--warning)" onclick="signup()">Register Account</button>
      <a onclick="toggleAuthView('login')" style="cursor:pointer; display:block; margin-top:15px; font-size:13px; text-decoration:underline;">Back to Login</a>
    </div>
    <p id="authError" style="color:var(--danger); font-size:12px; margin-top:15px;"></p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-wrapper" id="mainApp">
  <div class="left-sidebar">
    <h2 style="color:var(--accent); margin: 0 0 25px 0;">Elite Rummy</h2>
    <div class="nav-section">
      <button id="navNewGame" class="navBtn" onclick="showScreen('newGame')">Start New Game</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Active Games</button>
      <button id="navPlayers" class="navBtn" onclick="showScreen('players')">Players List</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
    </div>
    <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--glass-border); display:flex; gap:10px;">
        <button style="background:var(--warning); flex:1; color:#111;" onclick="viewMyProfile()">Profile</button>
        <button style="background:var(--danger); flex:1; color:white;" onclick="handleLogout()">Logout</button>
    </div>
  </div>
  <div class="main-pane" id="mainPane"></div>
  <div class="rhs-pane" id="rhsPane" style="display:none"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8",
  measurementId: "G-D5Z38J9JMC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let playersDb = [], savedGames = [], state = null, currentScreen = '';

auth.onAuthStateChanged(user => {
  if(user) { 
    document.getElementById('authScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    setOnlineStatus(user.uid, true);
    loadData();
    if(!currentScreen) showScreen('newGame');
  } else { 
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
});

async function setOnlineStatus(uid, status) {
  const docRef = db.collection('eliteData').doc('playersData');
  const doc = await docRef.get();
  if(doc.exists) {
    let list = doc.data().list || [];
    let idx = list.findIndex(p => p.id === uid);
    if(idx !== -1) {
      list[idx].isOnline = status;
      await docRef.set({ list: list });
    }
  }
}

function handleLogout() {
  const user = auth.currentUser;
  if(user) {
    setOnlineStatus(user.uid, false).then(() => {
        auth.signOut();
    });
  }
}

function loadData() {
  db.collection('eliteData').doc('playersData').onSnapshot(doc => { 
    if(doc.exists) { 
        playersDb = doc.data().list || []; 
        if(currentScreen === 'players') renderPlayers();
        if(currentScreen === 'newGame') renderNewGame();
    }
  });
  db.collection('eliteGames').onSnapshot(snap => {
    savedGames = []; snap.forEach(d => savedGames.push(d.data()));
    if(state) { 
        let s = savedGames.find(g => g.id === state.id); 
        if(s) { state = s; renderActive(); } 
    }
    if(currentScreen==='continue') renderContinue();
    if(currentScreen==='history') renderHistory();
    if(currentScreen==='reports') renderReports();
  });
}

function login() { 
  auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
  .catch(e => document.getElementById('authError').innerText = e.message); 
}

async function signup() {
  const f = document.getElementById('signupFirst').value, 
        l = document.getElementById('signupLast').value, 
        e = document.getElementById('signupEmail').value, 
        p = document.getElementById('signupPass').value, 
        c = document.getElementById('signupConfirm').value, 
        g = document.getElementById('signupGender').value;
  
  if(p !== c) return alert("Passwords do not match!");
  
  try {
    const cred = await auth.createUserWithEmailAndPassword(e, p);
    const fullName = (f + " " + l).toUpperCase();
    const docRef = db.collection('eliteData').doc('playersData');
    const doc = await docRef.get();
    let currentList = doc.exists ? (doc.data().list || []) : [];
    
    currentList.push({ id: cred.user.uid, fullName, gender: g, isOnline: true });
    await docRef.set({ list: currentList });
  } catch (err) { alert(err.message); }
}

function showScreen(s) {
  currentScreen = s;
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active-nav'));
  document.getElementById('rhsPane').style.display='none';
  const main = document.getElementById('mainPane');
  
  if(s==='newGame') { document.getElementById('navNewGame').classList.add('active-nav'); renderNewGame(); }
  if(s==='players') { document.getElementById('navPlayers').classList.add('active-nav'); renderPlayers(); }
  if(s==='continue') { document.getElementById('navContinue').classList.add('active-nav'); renderContinue(); }
  if(s==='history') { document.getElementById('navHistory').classList.add('active-nav'); renderHistory(); }
  if(s==='reports') { document.getElementById('navReports').classList.add('active-nav'); renderReports(); }
}

/* PLAYERS LIST SCREEN */
function renderPlayers() {
  let html = `<h2>Registered Players</h2><table><tr><th>Player Name</th><th>Gender</th><th>Status</th></tr>`;
  playersDb.sort((a,b)=>a.fullName.localeCompare(b.fullName)).forEach(p => {
    html += `<tr>
      <td><b>${p.fullName}</b></td>
      <td>${p.gender.toUpperCase()}</td>
      <td><span class="status-tag ${p.isOnline?'online':'offline'}">${p.isOnline?'ONLINE':'OFFLINE'}</span></td>
    </tr>`;
  });
  document.getElementById('mainPane').innerHTML = html + `</table>`;
}

/* START NEW GAME SCREEN */
function renderNewGame() {
  const onlineOnes = playersDb.filter(p => p.isOnline);
  let opts = `<option value="">-- Select Online Player --</option>` + onlineOnes.map(p => `<option value="${p.fullName}">${p.fullName}</option>`).join('');
  
  document.getElementById('mainPane').innerHTML = `
    <h2>Start New Game</h2>
    <div class="game-card">
        <input id="gName" class="standard-input" placeholder="Enter Game Name">
        <div id="playerSelectionArea">
            <select class="standard-input p-select">${opts}</select>
            <select class="standard-input p-select">${opts}</select>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="navBtn" style="flex:1; text-align:center;" onclick="addNewPlayerField()">+ Add Player</button>
            <button class="actionBtn" style="flex:1.5;" onclick="startGame()">Confirm & Start</button>
        </div>
        <p style="font-size:11px; color:#aaa; margin-top:15px;">* Only players currently online can be added to a new game.</p>
    </div>`;
}

function addNewPlayerField() {
  const onlineOnes = playersDb.filter(p => p.isOnline);
  let opts = `<option value="">-- Select Online Player --</option>` + onlineOnes.map(p => `<option value="${p.fullName}">${p.fullName}</option>`).join('');
  const div = document.createElement('div');
  div.style.display = "flex"; div.style.gap = "10px";
  div.innerHTML = `<select class="standard-input p-select" style="flex:1;">${opts}</select><button onclick="this.parentElement.remove()" style="background:var(--danger); height:55px; margin-bottom:15px;">✕</button>`;
  document.getElementById('playerSelectionArea').appendChild(div);
}

function startGame() {
  const name = document.getElementById('gName').value || "New Game";
  const players = Array.from(document.querySelectorAll('.p-select')).map(s => s.value).filter(v => v !== "");
  
  if(players.length < 2) return alert("Select at least 2 online players.");
  if(new Set(players).size !== players.length) return alert("Cannot add the same player twice.");

  const now = new Date();
  state = {
    id: Date.now().toString(),
    name: name,
    startTime: now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
    endTime: null,
    players: players,
    totals: {},
    round: 1,
    history: [],
    winner: null,
    actionStats: {}
  };

  players.forEach(p => { 
    state.totals[p] = 0; 
    state.actionStats[p] = { shows: 0, fcs: 0, drops: 0, mds: 0, outs: 0 }; 
  });

  db.collection('eliteGames').doc(state.id).set(state);
  renderActive();
}

function renderActive() {
  document.getElementById('rhsPane').style.display='block';
  let html = `<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="color:var(--accent); margin:0;">${state.name}</h2>
    <span style="font-size:11px; color:#aaa;">Started: ${state.startTime}</span>
  </div>
  <table><tr><th>Warrior</th><th>Tactics</th><th>Score</th></tr>`;

  state.players.forEach(p => {
    let isOut = state.totals[p] >= 240;
    html += `<tr style="${isOut?'opacity:0.4; background:rgba(231,76,60,0.1);':''}">
      <td><b>${p}</b><br><input type="number" id="manual-${p}" style="width:50px; margin-top:5px;" placeholder="0"><button onclick="scoreManual('${p}')">+</button></td>
      <td>
        <button style="background:var(--accent)" onclick="score('${p}',0,'shows')" ${isOut?'disabled':''}>S</button>
        <button style="background:var(--warning)" onclick="score('${p}',20,'drops')" ${isOut?'disabled':''}>D</button>
        <button style="background:#8e44ad; color:white;" onclick="score('${p}',40,'mds')" ${isOut?'disabled':''}>MD</button>
        <button style="background:var(--danger); color:white;" onclick="score('${p}',80,'fcs')" ${isOut?'disabled':''}>FC</button>
      </td>
      <td><h3 style="margin:0">${state.totals[p]}</h3></td>
    </tr>`;
  });

  document.getElementById('mainPane').innerHTML = html + `</table><button class="actionBtn" style="margin-top:20px;" onclick="nextRound()">End Round</button>`;
  renderHistoryPane();
}

function score(p, val, type) {
  state.totals[p] += val;
  if(type) state.actionStats[p][type]++;
  db.collection('eliteGames').doc(state.id).set(state);
}

function scoreManual(p) {
  let v = parseInt(document.getElementById(`manual-${p}`).value) || 0;
  score(p, v);
}

function nextRound() {
  state.history.push({ round: state.round, totals: {...state.totals} });
  state.round++;
  
  let active = state.players.filter(p => state.totals[p] < 240);
  if(active.length === 1) {
    state.winner = active[0];
    const now = new Date();
    state.endTime = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  db.collection('eliteGames').doc(state.id).set(state);
}

function renderContinue() {
  let active = savedGames.filter(g => !g.winner);
  document.getElementById('mainPane').innerHTML = `<h2>Active Games</h2>` + (active.length ? active.map(g => `
    <div class="game-card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><b>${g.name}</b><br><small>Started: ${g.startTime}</small></div>
        <button class="navBtn active-nav" style="width:auto;" onclick="resume('${g.id}')">Resume</button>
    </div>`).join('') : `<p>No active games found.</p>`);
}

function resume(id) { state = savedGames.find(g => g.id === id); renderActive(); }

function renderHistory() {
  let finished = savedGames.filter(g => g.winner);
  document.getElementById('mainPane').innerHTML = `<h2>Game History</h2>` + finished.map(g => `
    <div class="game-card">
        <div style="display:flex; justify-content:space-between;">
            <b>${g.name}</b>
            <span style="color:var(--accent)">Winner: ${g.winner}</span>
        </div>
        <div style="font-size:11px; color:#aaa; margin-top:5px;">
            Start: ${g.startTime} | End: ${g.endTime}
        </div>
    </div>`).join('');
}

function renderReports() {
  let html = `<h2>Performance Reports</h2><table><tr><th>Player</th><th>Win Rate</th><th>Total Matches</th></tr>`;
  playersDb.forEach(p => {
    let matches = savedGames.filter(g => g.winner && g.players.includes(p.fullName));
    let wins = matches.filter(g => g.winner === p.fullName).length;
    let rate = matches.length ? ((wins / matches.length) * 100).toFixed(1) : 0;
    html += `<tr><td><b>${p.fullName}</b></td><td>${rate}%</td><td>${matches.length}</td></tr>`;
  });
  document.getElementById('mainPane').innerHTML = html + `</table>`;
}

function renderHistoryPane() {
  let h = "<h3>Round Logs</h3>";
  state.history.forEach(r => h += `<div style="font-size:11px; margin-bottom:5px; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px;">
    <b>Round ${r.round}:</b><br>${Object.entries(r.totals).map(([p, s]) => p + ": " + s).join(' | ')}
  </div>`);
  document.getElementById('rhsPane').innerHTML = h;
}

function toggleAuthView(v) {
  document.getElementById('loginView').style.display = v==='login'?'block':'none';
  document.getElementById('signupView').style.display = v==='signup'?'block':'none';
}

function togglePass(id) {
  const x = document.getElementById(id);
  x.type = x.type === "password" ? "text" : "password";
}

function viewMyProfile() {
  const me = playersDb.find(p => p.id === auth.currentUser.uid);
  if(me) alert(`Logged in as: ${me.fullName}\nStatus: Online`);
}
</script>
</body>
</html>
