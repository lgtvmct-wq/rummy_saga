<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Rummy CRM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #27ae60;
            --primary: #3b82f6;
            --danger: #e11d48;
            --warning: #f59e0b;
            --info: #06b6d4;
            --text: #f1f5f9;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; font-size: 14px; }
        .container { max-width: 600px; margin: auto; }
        h1, h2 { text-align: center; color: white; margin-bottom: 20px; font-weight: 800; letter-spacing: -0.5px; }
        button { 
            padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.2s; color: white; background: var(--primary); width: 100%; margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }
        .std-input { 
            width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: white; 
            margin-bottom: 12px; font-size: 16px;
        }
        .main-nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-card { 
            background: var(--card); padding: 20px; border-radius: 16px; text-align: center; 
            border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .nav-card small { display: block; opacity: 0.5; margin-top: 5px; font-size: 11px; }

        .player-row { 
            background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
        }
        .tag { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; background: #334155; }
        .tag.out { background: var(--danger); }
        .tag.safe { background: var(--accent); }

        .active-game-card { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid #334155; }
        .score-box { 
            background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 12px; margin-bottom: 10px; 
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .tactic-btn { 
            font-size: 10px; padding: 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); 
            min-width: 32px; font-weight: 800;
        }
        .tactic-btn.active { outline: 2px solid white; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
        }
        .modal-content { background: var(--card); width: 100%; max-width: 350px; border-radius: 20px; padding: 20px; border: 1px solid #334155; }

        @media screen and (max-height: 700px) {
            .nav-card { padding: 15px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="mainPane"></div>
</div>

<script>
// --- AUTH & FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyC...", 
  authDomain: "eliterummy-xxx.firebaseapp.com",
  projectId: "eliterummy-xxx",
  storageBucket: "eliterummy-xxx.appspot.com",
  messagingSenderId: "xxx",
  appId: "xxx"
};
// Use actual config from your environment
firebase.initializeApp(window.firebaseAppConfig || firebaseConfig);
const db = firebase.firestore();

// --- STATE ---
let playersDb = [];
let savedGames = [];
let state = null;
let currentScreen = 'home';
let isPromptingReEntry = false;
let reEntryPlayer = null;

// --- UTILS ---
function getFirstName(n) { return (n || '').split(' ')[0]; }
function formatEliteDate(d) { return d.toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); }

// --- VIEWS ---
function showScreen(s) {
    currentScreen = s;
    if(s==='home') renderHome();
    else if(s==='players') renderPlayers();
    else if(s==='newGame') renderNewGame();
    else if(s==='continue') renderContinue();
    else if(s==='history') renderHistory();
    else if(s==='reports') renderReports();
}

function renderHome() {
    document.getElementById('mainPane').innerHTML = `
        <div style="text-align:center; margin-bottom:30px;">
            <h1 style="margin:0; font-size:28px;">ELITE RUMMY</h1>
            <div style="font-size:12px; opacity:0.5; letter-spacing:2px; font-weight:800;">TOURNAMENT CRM</div>
        </div>
        <div class="main-nav">
            <div class="nav-card" onclick="showScreen('newGame')" style="border-bottom: 4px solid var(--accent)">
                <div style="font-size:30px">🎲</div><b>START</b><small>New Tournament</small>
            </div>
            <div class="nav-card" onclick="showScreen('continue')" style="border-bottom: 4px solid var(--warning)">
                <div style="font-size:30px">⏳</div><b>RESUME</b><small>Active Matches</small>
            </div>
            <div class="nav-card" onclick="showScreen('players')" style="border-bottom: 4px solid var(--primary)">
                <div style="font-size:30px">👥</div><b>PLAYERS</b><small>Directory</small>
            </div>
            <div class="nav-card" onclick="showScreen('reports')" style="border-bottom: 4px solid var(--info)">
                <div style="font-size:30px">📊</div><b>REPORTS</b><small>Game Details</small>
            </div>
        </div>
        <button onclick="showScreen('history')" style="background:#334155; margin-top:20px;">Match History Archive</button>
    `;
}

function renderPlayers() {
    document.getElementById('mainPane').innerHTML = `
        <button onclick="showScreen('home')" style="background:none; color:var(--primary); text-align:left; width:auto; padding:0 0 10px 0;">← Back</button>
        <h2>Players</h2>
        <input type="text" id="pName" placeholder="Player Alias / Name" class="std-input">
        <button onclick="addPlayer()" style="background:var(--accent)">+ Create Player</button>
        <div id="pList" style="margin-top:20px;"></div>
    `;
    document.getElementById('pList').innerHTML = playersDb.map(p => `
        <div class="player-row">
            <b>${p.name}</b>
            <button onclick="delPlayer('${p.id}')" style="background:var(--danger); width:auto; margin:0; padding:5px 10px; font-size:11px;">Remove</button>
        </div>
    `).join('');
}

async function addPlayer() {
    const n = document.getElementById('pName').value.trim();
    if(n) { await db.collection('players').add({name:n}); document.getElementById('pName').value=''; }
}
async function delPlayer(id) { if(confirm("Delete player?")) await db.collection('players').doc(id).delete(); }

function renderNewGame() {
    document.getElementById('mainPane').innerHTML = `
        <button onclick="showScreen('home')" style="background:none; color:var(--primary); text-align:left; width:auto; padding:0 0 10px 0;">← Back</button>
        <h2>New Tournament</h2>
        <div id="pSel" style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;"></div>
        <button id="startBtn" onclick="initGame()" style="margin-top:20px; background:var(--accent); font-size:18px; padding:15px;" disabled>Launch Match ➔</button>
    `;
    let sel = [];
    document.getElementById('pSel').innerHTML = playersDb.map(p => `
        <div id="card-${p.id}" onclick="toggleSel('${p.id}', '${p.name}')" 
             style="background:var(--card); padding:15px; border-radius:12px; border:1px solid #334155; text-align:center;">
             ${p.name}
        </div>
    `).join('');

    window.toggleSel = (id, name) => {
        const idx = sel.findIndex(x => x.id === id);
        if(idx > -1) { sel.splice(idx,1); document.getElementById('card-'+id).style.borderColor='#334155'; document.getElementById('card-'+id).style.background='var(--card)'; }
        else { sel.push({id, name}); document.getElementById('card-'+id).style.borderColor='var(--accent)'; document.getElementById('card-'+id).style.background='rgba(39, 174, 96, 0.1)'; }
        document.getElementById('startBtn').disabled = sel.length < 2;
    };

    window.initGame = async () => {
        const gameId = 'G' + Date.now();
        const pNames = sel.map(x => x.name);
        const totals = {}; pNames.forEach(n => totals[n] = 0);
        const g = {
            id: gameId,
            name: 'Elite ' + pNames.map(n => n.charAt(0)).join(''),
            players: pNames,
            totals: totals,
            eliminated: {},
            history: [],
            roundScores: {},
            startTime: formatEliteDate(new Date()),
            winner: null
        };
        pNames.forEach(n => g.roundScores[n] = null);
        await db.collection('eliteGames').doc(gameId).set(g);
        state = g;
        showScreen('activeGame');
    };
}

// --- DATA LISTENER ---
function loadData() {
  db.collection('players').onSnapshot(snap => { 
    playersDb =[]; snap.forEach(doc => playersDb.push({id: doc.id, ...doc.data()})); 
    if(currentScreen === 'players') showScreen('players');
  });
  db.collection('eliteGames').onSnapshot(snap => {
    savedGames =[]; snap.forEach(d => savedGames.push(d.data()));
    if(currentScreen === 'activeGame' && state && !isPromptingReEntry) {
        let s = savedGames.find(g => g.id === state.id);
        if(s) { state = s; renderActive(); } else { state = null; showScreen('newGame'); }
    } else if(['continue', 'history', 'reports'].includes(currentScreen)) {
        showScreen(currentScreen);
    }
  });
}
loadData();

// --- ACTIVE GAME ENGINE ---
function renderActive() {
    if(!state) return;
    document.getElementById('mainPane').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="opacity:0.6; font-size:12px;">Active: <b>${state.name}</b></span>
            <button onclick="showScreen('home')" style="width:auto; margin:0; padding:5px 12px; background:#334155; font-size:11px;">Quit</button>
        </div>
        <div class="active-game-card">
            <div id="pScores"></div>
            <button id="endBtn" onclick="endRound()" style="height:55px; font-size:18px; margin-top:10px;">End Round ✓</button>
        </div>
        <div id="reEntryModal"></div>
    `;
    
    let listHtml = '';
    state.players.forEach(p => {
        const score = state.totals[p] || 0;
        const isOut = state.eliminated[p] || score >= 240;
        const rs = state.roundScores[p];
        const dLock = rs && rs !== 20;

        listHtml += `
        <div class="score-box" style="${isOut?'opacity:0.4':''}">
            <div style="width:70px;">
                <div style="font-weight:bold; ${score>200?'color:var(--danger)':''}">${getFirstName(p)}</div>
                <div style="font-size:18px; font-weight:800; color:var(--warning)">${score}</div>
                ${isOut?'<span class="tag out">OUT</span>':'<span class="tag safe">IN</span>'}
            </div>
            <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:center; flex:1;">
                <button class="tactic-btn ${rs==='S'?'active':''}" style="background:var(--primary)" onclick="setTactic('${p}', 'S')" ${isOut?'disabled':''}>S</button>
                <button class="tactic-btn ${rs===20?'active':''}" style="background:var(--warning)" onclick="setTactic('${p}', 'D')" ${isOut || dLock?'disabled':''}>D</button>
                <button class="tactic-btn ${rs===40?'active':''}" style="background:#8e44ad; color:white;" onclick="setTactic('${p}', 'MD')" ${isOut?'disabled':''}>MD</button>
                <button class="tactic-btn ${rs===80?'active':''}" style="background:var(--danger); color:white;" onclick="setTactic('${p}', 'FC')" ${isOut?'disabled':''}>FC</button>
                <button class="tactic-btn ${rs===0?'active':''}" style="background:#2c3e50; color:white;" onclick="setTactic('${p}', 'FS')" ${isOut?'disabled':''}>FS</button>
                <button style="background:#333; color:white; font-size:10px; border:none; border-radius:4px; padding:5px;" onclick="markOut('${p}')" ${isOut?'disabled':''}>OUT</button>
            </div>
            <input type="text" inputmode="numeric" class="std-input" style="height:35px; margin:5px 0 0 0; text-align:center; font-size:12px; width:100%;" value="${rs===null?'':rs}" onchange="manualInput('${p}', this.value)" ${isOut?'disabled':''}>
        </div>`;
    });
    document.getElementById('pScores').innerHTML = listHtml;
    validateEndBtn();
}

function setTactic(p, type) {
    if(state.winner || state.eliminated[p]) return;
    let v = null;
    if(type==='S'){ 
        const isCurrentlyS = state.roundScores[p] === 'S';
        // Clear ANY winner (S or 0) when setting S
        state.players.forEach(pl => {
            if(state.roundScores[pl]==='S' || state.roundScores[pl]===0) state.roundScores[pl]=null;
        }); 
        v = isCurrentlyS ? null : 'S'; 
    }
    else if(type==='D') v=(state.roundScores[p]===20)?null:20;
    else if(type==='MD') v=(state.roundScores[p]===40)?null:40;
    else if(type==='FC') v=(state.roundScores[p]===80)?null:80;
    else if(type==='FS') {
        const isCurrentlyFS = state.roundScores[p]===0;
        // Clear ANY winner (S or 0) when setting FS
        state.players.forEach(pl => {
            if(state.roundScores[pl]==='S' || state.roundScores[pl]===0) state.roundScores[pl]=null;
        });
        v = isCurrentlyFS ? null : 0;
    }
    state.roundScores[p] = v;
    renderActive(); // Local render for immediate feedback
    db.collection('eliteGames').doc(state.id).update({ roundScores: state.roundScores });
}

function manualInput(p, val) {
    let raw = val.trim();
    let v = raw.toUpperCase()==='S'?'S':(raw===''?null:parseInt(raw));
    
    // If setting a winner manually (S or 0), clear others
    if(v==='S' || v===0) {
        state.players.forEach(pl => {
            if(pl !== p && (state.roundScores[pl]==='S' || state.roundScores[pl]===0)) state.roundScores[pl]=null;
        });
    }
    if(v !== 'S' && (isNaN(v) || v === null)) v = null;
    state.roundScores[p]=v;
    renderActive(); 
    db.collection('eliteGames').doc(state.id).update({ roundScores: state.roundScores });
}

function validateEndBtn() {
    if(!state) return;
    // Active players are those not eliminated AND under 240
    let active = state.players.filter(p => !state.eliminated[p] && (state.totals[p] || 0) < 240);
    
    // One player must be marked as winner (S or 0)
    let winners = active.filter(p => state.roundScores[p] === 'S' || state.roundScores[p] === 0);
    
    // Ensure ALL active players have some score entered
    let allEntered = active.every(p => {
        const val = state.roundScores[p];
        // Score is valid if it's 'S' or a valid number (including 0)
        if (val === 'S') return true;
        if (typeof val === 'number' && !isNaN(val)) return true;
        return false;
    });

    const btn = document.getElementById('endBtn');
    if(btn) { 
        const isReady = winners.length === 1 && allEntered;
        btn.disabled = !isReady; 
        // Use literal green for active state as requested
        btn.style.background = btn.disabled ? "#555" : "#27ae60"; 
        btn.style.opacity = btn.disabled ? "0.5" : "1";
        btn.style.cursor = btn.disabled ? "not-allowed" : "pointer";
    }
}

function markOut(p) {
    if(confirm(`Eliminate ${p} from game?`)) {
        state.eliminated[p] = true;
        state.totals[p] = 240;
        db.collection('eliteGames').doc(state.id).update({ eliminated: state.eliminated, totals: state.totals });
    }
}

async function endRound() {
    const roundData = { round: state.history.length + 1, scores: {...state.roundScores}, totals: {...state.totals}, reentries: {} };
    
    state.players.forEach(p => {
        if(!state.eliminated[p]) {
            let s = state.roundScores[p];
            if(s === 'S') s = 0;
            state.totals[p] = (state.totals[p] || 0) + (s || 0);
            if(state.totals[p] >= 240) {
                state.eliminated[p] = true;
                state.totals[p] = 240;
            }
        }
        state.roundScores[p] = null;
    });

    state.history.push(roundData);
    
    // Check Winners
    let survivors = state.players.filter(p => !state.eliminated[p]);
    if(survivors.length <= 1) {
        state.winner = survivors[0] || 'No Winner';
        state.endTime = formatEliteDate(new Date());
    }

    await db.collection('eliteGames').doc(state.id).set(state);
    
    // Check if any dead players need re-entry prompt (manual check is better)
    checkReEntries();
}

function checkReEntries() {
    let dead = state.players.filter(p => state.eliminated[p] && state.totals[p] === 240);
    let survivors = state.players.filter(p => !state.eliminated[p]);
    let maxS = survivors.length ? Math.max(...survivors.map(p => state.totals[p])) : 0;
    
    for(let p of dead) {
        if(confirm(`${p} reached 240. Allow Re-Entry at ${maxS + 1}?`)) {
            state.eliminated[p] = false;
            state.totals[p] = maxS + 1;
            db.collection('eliteGames').doc(state.id).update({ eliminated: state.eliminated, totals: state.totals });
            break; 
        }
    }
}

function renderContinue() {
    let act = savedGames.filter(g => !g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Active Games</h2>` + act.map(g => `
        <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div style="flex:1; min-width:120px;"><b>${g.name}</b></div>
            <div style="display:flex; gap:8px;">
                <button onclick="resume('${g.id}')" style="background:var(--accent);">Resume</button>
                <button onclick="endGameManually('${g.id}')" style="background:var(--danger); font-size:11px;">End Game</button>
            </div>
        </div>`).join('') || `<p>No active games.</p>`;
}
function resume(id) { state=savedGames.find(g => g.id === id); currentScreen='activeGame'; renderActive(); }

async function endGameManually(id) {
    const g = savedGames.find(x => x.id === id);
    if(!g) return;
    if(!confirm(`Are you sure you want to end "${g.name}" manually? The player(s) with the lowest points among survivors will be declared winner(s).`)) return;

    // Favor survivors (those not yet at 240)
    let survivors = g.players.filter(p => !g.eliminated[p] && (g.totals[p] || 0) < 240);
    if (survivors.length === 0) survivors = g.players; // Fallback to all if everyone reached 240

    let minScore = Math.min(...survivors.map(p => g.totals[p] || 0));
    let winners = survivors.filter(p => (g.totals[p] || 0) === minScore);
    
    g.players.forEach(p => {
        if(!winners.includes(p)) {
            g.eliminated[p] = true;
            // Force them to 240 if they aren't already
            if ((g.totals[p] || 0) < 240) g.totals[p] = 240;
        }
    });

    g.winner = (winners.length > 1 ? winners.join(' & ') : winners[0]);
    g.isAborted = true; // Mark as aborted
    g.endTime = formatEliteDate(new Date());
    
    // Add a final history round to record the state at the end
    g.history.push({
        round: 'ABORTED',
        scores: g.players.reduce((acc, p) => ({...acc, [p]: winners.includes(p) ? 'W' : 'L'}), {}),
        totals: {...g.totals},
        reentries: {}
    });

    await db.collection('eliteGames').doc(g.id).set(g);
    showScreen('continue');
}

function renderHistory() {
    let fin = savedGames.filter(g => g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Match History</h2>` + fin.map(g => `<div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;"><div><b>${g.name}</b> ${g.isAborted ? '<span style="color:var(--danger); font-size:10px; margin-left:5px;">(ABORTED)</span>' : ''}<br><small>Winner: ${g.winner}</small></div><button onclick="delMatch('${g.id}')" style="background:var(--danger)">Del</button></div>`).join('');
}
function delMatch(id) { if(confirm("Delete this match?")) db.collection('eliteGames').doc(id).delete(); }

function renderReports() {
    let fin = savedGames.filter(g => g.winner);
    document.getElementById('mainPane').innerHTML = `<h2>Game Reports</h2>` + fin.map(g => `
        <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <span style="flex:1;"><b>${g.name}</b> ${g.isAborted ? '<span style="color:var(--danger); font-size:10px; margin-left:5px;">(ABORTED)</span>' : ''}<br><small style="opacity:0.6">${g.endTime || ''}</small></span>
            <div style="display:flex; gap:5px;">
                <button onclick="viewTableReport('${g.id}')" style="background:var(--accent); font-size:12px;">Table View</button>
                <button onclick="genPDF('${g.id}')" style="background:var(--info); font-size:12px;">PDF</button>
            </div>
        </div>`).join('') || `<p>No completed games found.</p>`;
}

function viewTableReport(id) {
    const g = savedGames.find(x => x.id === id);
    if(!g) return;

    let reportTotals = {};
    g.players.forEach(p => reportTotals[p] = 0);

    document.getElementById('mainPane').innerHTML = `
        <button onclick="showScreen('reports')" style="background:none; color:var(--primary); text-align:left; width:auto; padding:0 0 10px 0;">← Back</button>
        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:20px;">
            <h3 style="margin:0">${g.name} Report</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:11px; margin-top:10px;">
                <div><span style="opacity:0.6">Start Time:</span><br><b>${g.startTime || '-'}</b></div>
                <div><span style="opacity:0.6">End Time:</span><br><b>${g.endTime || '-'}</b></div>
                <div><span style="opacity:0.6">Tournament Winner:</span><br><b style="color:var(--accent)">${getFirstName(g.winner || '')}</b></div>
            </div>
            ${g.isAborted ? '<div style="margin-top:10px; color:var(--danger); font-weight:bold; font-size:12px; text-align:center; padding:5px; background:rgba(231, 76, 60, 0.1); border-radius:4px;">GAME ABORTED</div>' : ''}
        </div>
        <div style="overflow-x:auto; background: linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92)), url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2073&auto=format&fit=crop'); background-size: cover; background-position: center; padding:15px; border-radius:12px; border:1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top:10px;">
            <table style="min-width:400px; color: #111; border-collapse: collapse; border: 1px solid #ddd; background: transparent;">
                <thead>
                    <tr style="background:#f39c12; color: white;">
                        <th style="padding:10px; border: 1px solid #ddd;">ROUND</th>
                        ${g.players.map(p => `<th style="padding:10px; border: 1px solid #ddd; text-transform:uppercase;">${getFirstName(p)}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${g.history.map((h, i) => {
                        return `<tr style="background:${i%2===0?'rgba(255,255,255,0.85)':'rgba(240,240,240,0.85)'}">
                            <td style="padding:12px 8px; border:1px solid #ddd; text-align:center; font-weight:bold;">${h.round}</td>
                            ${g.players.map(p => {
                                const s = h.scores[p];
                                const isWin = s === 'S' || s === 0;
                                const displayScore = s === 'S' ? 'SHOW' : (s === null ? '-' : s);
                                reportTotals[p] = (reportTotals[p] || 0) + (s === 'S' ? 0 : (s || 0));
                                return `<td style="padding:12px 8px; border:1px solid #ddd; text-align:center;">
                                    <div style="${isWin?'color:#27ae60; font-weight:bold;':''}">${displayScore}</div>
                                    <div style="font-size:10px; color:#7f8c8d; margin-top:2px;">T: ${reportTotals[p]}</div>
                                </td>`;
                            }).join('')}
                        </tr>`;
                    }).join('')}
                </tbody>
                <tfoot>
                <tr style="background:#f8f9fa;">
                    <td style="color:#f39c12; font-weight:bold; padding:15px 8px; border: 1px solid #ddd; text-align: center;">TOTAL</td>
                    ${g.players.map(p => {
                        let isWinner = g.winner && (g.winner === p || g.winner.split(' & ').includes(p));
                        const t = reportTotals[p] !== undefined ? reportTotals[p] : (g.totals[p] || 0);
                        return `<td style="color:#f39c12; font-weight:bold; padding:15px 8px; border: 1px solid #ddd; text-align: center;">
                            <span style="font-size:16px;">${t}</span>
                            ${isWinner ? '<br><span style="font-size:9px; color:#27ae60;">👑 WINNER</span>' : ''}
                        </td>`;
                    }).join('')}
                </tr>
                </tfoot>
            </table>
            <div style="text-align:right; font-size:10px; color:#555; margin-top:10px; font-style:italic;">Elite CRM Official Report</div>
        </div>
    `;
}

async function genPDF(id) {
    const g = savedGames.find(x => x.id === id);
    if(!g) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(22);
    doc.text("Elite Rummy CRM Report", 14, 20);
    doc.setFontSize(10);
    doc.text(`Start: ${g.startTime || '-'}  |  End: ${g.endTime || '-'}`, 14, 28);
    doc.text(`Winner: ${getFirstName(g.winner || '')}`, 14, 34);
    if (g.isAborted) {
        doc.setTextColor(231, 76, 60);
        doc.text("GAME ABORTED", 14, 40);
        doc.setTextColor(0, 0, 0);
    }

    let winnerFoundInHistory = false;
    let prevPdfTotals = {};
    g.players.forEach(p => prevPdfTotals[p] = 0);

    const body = g.history.map(h => {
        let row = [h.round];
        g.players.forEach(p => {
            let s = h.scores[p];
            prevPdfTotals[p] += (s === 'S' ? 0 : (s || 0));
            row.push(`${s === 'S' ? 'SHOW' : (s === null ? '-' : s)}\n(T:${prevPdfTotals[p]})`);
        });
        return row;
    });

    let pdfTotals = {};
    g.players.forEach(p => pdfTotals[p] = 0);
    g.history.forEach(h => {
        g.players.forEach(p => {
            let s = h.scores[p];
            pdfTotals[p] += (s === 'S' ? 0 : (s || 0));
        });
    });
    
    body.push(['TOTAL', ...g.players.map(p => {
        let isWinner = g.winner && (g.winner === p || g.winner.split(' & ').includes(p));
        const t = pdfTotals[p] !== undefined ? pdfTotals[p] : (g.totals[p] || 0);
        return t + (isWinner ? ' (Winner)' : '');
    })]);

    doc.autoTable({
        startY: 45,
        head: [['Round', ...g.players.map(p => getFirstName(p))]],
        body: body,
        theme: 'striped',
        headStyles: { fillColor: [44, 62, 80], textColor: 255 },
        styles: { fontSize: 8, cellPadding: 3 }
    });

    doc.save(`${g.name}_Report.pdf`);
}

// Initial Screen
showScreen('home');
</script>
