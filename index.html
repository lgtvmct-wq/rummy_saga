<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Rummy Circle</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.12);
    --sidebar-bg: rgba(15, 32, 39, 0.95);
    --btn-show: #00e676;
    --btn-fc: #ff5252;
    --btn-drop: #ff9800;
    --btn-md: #ffc107;
    --btn-out: #9c27b0;
    --text-light: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.2);
  }

  body { 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: var(--text-light); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    background-image: linear-gradient(rgba(18, 55, 68, 0.6), rgba(15, 32, 39, 0.7)), url('https://images.unsplash.com/photo-1541278107931-e006523892df?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* Initial state: hidden to prevent flashing */
  #mainApp, #authScreen { display: none; }

  .app-wrapper { display: flex; flex-direction: row; height: 100vh; width: 100vw; overflow: hidden; backdrop-filter: blur(8px); }
  
  .left-sidebar { width: 220px; background: var(--sidebar-bg); padding: 15px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; z-index: 10; overflow-y: hidden;}
  .nav-section { flex-shrink: 0; margin-bottom: 20px; }
  .player-roster-section { flex-grow: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 15px; }
  .player-roster-section h4 { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; margin-bottom: 10px; }
  .roster-item { font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; display: flex; align-items: center; }
  .roster-item span { color: var(--btn-show); font-weight: bold; margin-right: 8px; font-size: 14px;}

  .content-area { display: flex; flex: 1; overflow: hidden; }
  .main-pane { flex: 2; padding: 20px 30px; overflow-y: auto; }
  .rhs-pane { flex: 1; min-width: 350px; background: rgba(0,0,0,0.3); padding: 20px; border-left: 1px solid var(--glass-border); display: flex; flex-direction: column; overflow-y: auto; backdrop-filter: blur(15px);}

  .bigInput, .bigSelect { width: 100%; padding: 14px; margin-bottom: 10px; font-size: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.15); color: white; box-sizing: border-box; }
  
  button { padding: 8px 10px; margin: 2px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: #111; transition: 0.2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }

  .navBtn { width: 100%; margin-bottom: 8px; background: rgba(255,255,255,0.1); color: white; padding: 12px; text-align: left; }
  .navBtn.active-nav { background: var(--btn-show); color: #111; }
  
  .bigBtn { width: 100%; margin: 10px 0; font-size: 17px; padding: 15px; color: #111; background: var(--btn-show); }
  .googleBtn { background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
  
  .table-responsive { width: 100%; overflow-x: auto; border-radius: 12px; margin-top: 15px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 12px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  th { background: rgba(0,0,0,0.3); color: #ccc; font-size: 12px; text-transform: uppercase; }

  #authScreen { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 1000;}
  .auth-box { background: rgba(20, 40, 50, 0.85); padding: 40px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: center; width: 340px; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
  .toggle-link { color: var(--btn-show); cursor: pointer; font-size: 14px; text-decoration: underline; margin-top: 15px; display: inline-block; }

  @media (max-width: 900px) {
    .app-wrapper { flex-direction: column; overflow: auto; height: auto;}
    .left-sidebar { width: auto; height: auto; border-right: none; border-bottom: 1px solid var(--glass-border); }
    .player-roster-section { display: none; }
  }
</style>
</head>
<body>

<!-- AUTHENTICATION SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--btn-show); font-size: 32px; margin-bottom: 5px;">Elite Rummy</h1>
    <p style="color:#aaa; margin-bottom: 30px;">Players Portal</p>
    
    <div id="loginView">
      <input id="loginEmail" class="bigInput" type="email" placeholder="Email Address">
      <input id="loginPassword" class="bigInput" type="password" placeholder="Password">
      <button class="bigBtn" onclick="login()">Log In</button>
      <button class="bigBtn googleBtn" onclick="googleLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18"> Sign in with Google
      </button>
      <a class="toggle-link" onclick="toggleAuthView('signup')">Create a new account</a>
      <button style="background:transparent; border:1px dashed #555; color:#777; width:100%; padding:10px; margin-top:20px; font-size:11px;" onclick="devLogin()">🛠 DEV LOGIN</button>
    </div>

    <div id="signupView" style="display: none;">
      <div style="display:flex; gap:10px;">
        <input id="signupFirstName" class="bigInput" type="text" placeholder="First Name">
        <input id="signupSurname" class="bigInput" type="text" placeholder="Surname">
      </div>
      <div style="display:flex; gap:5px; margin-bottom:10px;">
        <input id="signupVikingName" class="bigInput" style="margin-bottom:0; background:rgba(0,230,118,0.1); color:var(--btn-show);" readonly>
        <button class="util" onclick="uiGenerateVikingName()">🎲</button>
      </div>
      <input id="signupEmail" class="bigInput" type="email" placeholder="Email Address">
      <input id="signupPassword" class="bigInput" type="password" placeholder="Password (6+ chars)">
      <input id="signupConfirm" class="bigInput" type="password" placeholder="Confirm Password">
      <button class="bigBtn" onclick="signup()">Enter Valhalla</button>
      <a class="toggle-link" onclick="toggleAuthView('login')">Back to Login</a>
    </div>
    <p id="authError" style="color:#ffb74d; font-size:13px; margin-top:15px; font-weight:bold;"></p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-wrapper" id="mainApp">
  <div class="left-sidebar">
    <div class="nav-section">
      <h3 style="color:var(--btn-show); font-size: 18px; text-align:center;">Elite Rummy</h3>
      <button id="navNewGame" class="navBtn" onclick="showScreen('newGame')">New Game</button>
      <button id="navContinue" class="navBtn" onclick="showScreen('continue')">Continue</button>
      <button id="navHistory" class="navBtn" onclick="showScreen('history')">History</button>
      <button id="navReports" class="navBtn" onclick="showScreen('reports')">Reports</button>
    </div>

    <div class="player-roster-section">
      <h4>Registered Players</h4>
      <div id="sidebarRoster"></div>
    </div>

    <div class="app-footer">
      <button class="deleteBtn" style="width:100%; padding:8px; margin-bottom:10px;" onclick="logout()">Log Out</button>
      <small>Version 11 • May 2026</small>
    </div>
  </div>

  <div class="content-area">
    <div class="main-pane" id="mainPane"></div>
    <div class="rhs-pane" id="rhsPane" style="display: none;"></div>
  </div>
</div>

<script>
/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCo_G5Vo7OkUsK-tUXVQKCkeTn_IHw9vB0",
  authDomain: "elite-rummy-circle.firebaseapp.com",
  projectId: "elite-rummy-circle",
  storageBucket: "elite-rummy-circle.firebasestorage.app",
  messagingSenderId: "762468709641",
  appId: "1:762468709641:web:b4e193ed1670e5d13ccfd8",
  measurementId: "G-D5Z38J9JMC"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* APP STATE */
let playersDb = [];
let savedGames = [];
let state = null;
let currentScreen = '';

/* AUTH OBSERVER - THE FIX IS HERE */
auth.onAuthStateChanged((user) => {
  if (user) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
    loadCloudData();
    // Only show the screen once auth is confirmed
    if(!currentScreen) showScreen('newGame');
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    currentScreen = ''; // Reset screen state
    toggleAuthView('login');
    document.getElementById('loginEmail').value = "";
    document.getElementById('loginPassword').value = "";
  }
});

function toggleAuthView(view) {
  document.getElementById('authError').innerText = "";
  if (view === 'signup') {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('signupView').style.display = 'block';
    uiGenerateVikingName();
  } else {
    document.getElementById('signupView').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
  }
}

function loadCloudData() {
  db.collection('eliteData').doc('playersData').onSnapshot((doc) => {
    if (doc.exists) {
      playersDb = doc.data().list || [];
      updateSidebarRoster();
      if (currentScreen === 'newGame') renderNewGameScreen();
    }
  });

  db.collection('eliteGames').onSnapshot((snapshot) => {
    let newGames = [];
    snapshot.forEach(doc => newGames.push(doc.data()));
    savedGames = newGames;
    if (state && state.id) {
      let upd = savedGames.find(g => g.id === state.id);
      if (upd) { state = upd; renderActiveGame(); }
    }
    if (currentScreen === 'continue') renderContinueScreen();
    if (currentScreen === 'history') renderHistoryScreen();
  });
}

function updateSidebarRoster() {
  const container = document.getElementById('sidebarRoster');
  let html = "";
  playersDb.sort((a,b) => a.fullName.localeCompare(b.fullName)).forEach(p => {
    html += `<div class="roster-item"><span>•</span> ${p.fullName}</div>`;
  });
  container.innerHTML = html;
}

/* ACTIONS */
function login() {
  const e = document.getElementById('loginEmail').value;
  const p = document.getElementById('loginPassword').value;
  auth.signInWithEmailAndPassword(e, p).catch(err => document.getElementById('authError').innerText = "Login Failed.");
}

function signup() {
  const f = document.getElementById('signupFirstName').value;
  const s = document.getElementById('signupSurname').value;
  const v = document.getElementById('signupVikingName').value;
  const e = document.getElementById('signupEmail').value;
  const p = document.getElementById('signupPassword').value;
  const c = document.getElementById('signupConfirm').value;
  if (p !== c) return alert("Passwords mismatch");
  
  auth.createUserWithEmailAndPassword(e, p).then(cred => {
    const fullName = (f + " " + s).toUpperCase();
    if (!playersDb.find(x => x.fullName === fullName)) {
      playersDb.push({ id: cred.user.uid, fullName: fullName, vikingName: v });
      db.collection('eliteData').doc('playersData').set({ list: playersDb });
    }
  }).catch(err => alert(err.message));
}

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res => {
    if (res.additionalUserInfo.isNewUser) {
      playersDb.push({ id: res.user.uid, fullName: res.user.displayName.toUpperCase(), vikingName: generateVikingNameString() });
      db.collection('eliteData').doc('playersData').set({ list: playersDb });
    }
  });
}

function logout() { auth.signOut(); }

function devLogin() {
  auth.signInWithEmailAndPassword("admin@elite.com", "dev123456").catch(() => {
    auth.createUserWithEmailAndPassword("admin@elite.com", "dev123456");
  });
}

function generateVikingNameString() {
  const pre = ["Thor", "Bjorn", "Ragnar", "Ivar", "Erik", "Lagertha", "Freya"];
  const post = ["Ironside", "Bloodaxe", "Storm", "Wolf", "the Red", "Shield"];
  return pre[Math.floor(Math.random()*pre.length)] + " " + post[Math.floor(Math.random()*post.length)];
}
function uiGenerateVikingName() { document.getElementById('signupVikingName').value = generateVikingNameString(); }

/* UI ROUTER */
function showScreen(scr) {
  currentScreen = scr;
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active-nav'));
  document.getElementById('rhsPane').style.display = 'none';
  if(scr === 'newGame') { document.getElementById('navNewGame').classList.add('active-nav'); renderNewGameScreen(); }
  if(scr === 'continue') { document.getElementById('navContinue').classList.add('active-nav'); renderContinueScreen(); }
  if(scr === 'history') { document.getElementById('navHistory').classList.add('active-nav'); renderHistoryScreen(); }
  if(scr === 'reports') { document.getElementById('navReports').classList.add('active-nav'); renderReportsScreen(); }
}

function renderNewGameScreen() {
  let opts = `<option value="">-- Choose Player --</option>`;
  playersDb.forEach(p => opts += `<option value="${p.fullName}">${p.fullName}</option>`);
  document.getElementById('mainPane').innerHTML = `
    <h2>Start New Match</h2>
    <div class="table-responsive" style="padding:20px;">
      <input id="gName" class="bigInput" placeholder="Match Name">
      <div id="selArea"><select class="bigSelect p-sel">${opts}</select><select class="bigSelect p-sel">${opts}</select></div>
      <button class="util" onclick="addSlot()">+ Add Player</button>
      <button class="bigBtn" onclick="startMatch()">Start Game</button>
    </div>`;
}

function addSlot() {
  let opts = `<option value="">-- Choose Player --</option>`;
  playersDb.forEach(p => opts += `<option value="${p.fullName}">${p.fullName}</option>`);
  const s = document.createElement('select'); s.className = 'bigSelect p-sel'; s.innerHTML = opts;
  document.getElementById('selArea').appendChild(s);
}

function startMatch() {
  const name = document.getElementById('gName').value || "Match " + new Date().toLocaleDateString();
  let players = [];
  document.querySelectorAll('.p-sel').forEach(s => { if(s.value) players.push(s.value); });
  if(players.length < 2) return alert("Min 2 players");
  state = { id: Date.now().toString(), gameName: name, players: players, totals: {}, roundScores: {}, eliminated: {}, hasReentered: {}, round: 1, dealerIndex: 0, winner: null, roundHistory: [] };
  players.forEach(p => { state.totals[p]=0; state.roundScores[p]=0; state.eliminated[p]=false; state.hasReentered[p]=false; });
  db.collection('eliteGames').doc(state.id).set(state);
  renderActiveGame();
}

function renderContinueScreen() {
  let html = `<h2>Active Games</h2>`;
  savedGames.filter(g => !g.winner).forEach(g => {
    html += `<div class="game-card"><div><b>${g.gameName}</b><br><small>Round ${g.round}</small></div><button class="resumeBtn" onclick="resume('${g.id}')">Resume</button></div>`;
  });
  document.getElementById('mainPane').innerHTML = html;
}

function resume(id) { state = savedGames.find(x => x.id === id); renderActiveGame(); }

function renderActiveGame() {
  document.getElementById('rhsPane').style.display = 'block';
  let html = `<div class="flex-row"><h2>${state.gameName}</h2></div>`;
  if(state.winner) html += `<h1 style="color:var(--btn-show); text-align:center;">🏆 ${state.winner} WINS!</h1>`;
  html += `<div class="table-responsive"><table><tr><th>Player</th><th>Actions</th><th>Total</th></tr>`;
  state.players.forEach(p => {
    let out = state.eliminated[p];
    html += `<tr class="${out?'eliminated':''}"><td>${p}</td><td><button class="show" onclick="score('${p}', 0)" ${out?'disabled':''}>SHOW</button><button class="fc" onclick="score('${p}', 80)" ${out?'disabled':''}>FC</button><button class="drop" onclick="score('${p}', 20)" ${out?'disabled':''}>DROP</button><button class="out" onclick="score('${p}', 240)" ${out?'disabled':''}>OUT</button></td><td><h3>${state.totals[p]}</h3></td></tr>`;
  });
  html += `</table></div>`;
  if(!state.winner) html += `<button class="bigBtn" onclick="endRound()">End Round</button>`;
  document.getElementById('mainPane').innerHTML = html;
  renderHistory();
}

function score(p, val) {
  state.roundScores[p] = val;
  state.totals[p] += val;
  if(state.totals[p] >= 240) state.eliminated[p] = true;
  db.collection('eliteGames').doc(state.id).set(state);
}

function endRound() {
  state.roundHistory.push({ round: state.round, scores: {...state.roundScores} });
  state.round++;
  state.players.forEach(p => state.roundScores[p] = 0);
  let active = state.players.filter(p => !state.eliminated[p]);
  if(active.length === 1) state.winner = active[0];
  db.collection('eliteGames').doc(state.id).set(state);
}

function renderHistory() {
  let h = `<h3>Round History</h3>`;
  state.roundHistory.forEach(r => {
    h += `<div style="font-size:12px; margin-bottom:5px;"><b>R${r.round}:</b> `;
    Object.keys(r.scores).forEach(p => h += `${p.split(' ')[0]}:${r.scores[p]} | `);
    h += `</div>`;
  });
  document.getElementById('rhsPane').innerHTML = h;
}

function renderHistoryScreen() {
  let html = `<h2>Completed</h2>`;
  savedGames.filter(g => g.winner).forEach(g => {
    html += `<div class="game-card"><b>${g.gameName}</b><br>Winner: ${g.winner}</div>`;
  });
  document.getElementById('mainPane').innerHTML = html;
}

function renderReportsScreen() {
  document.getElementById('mainPane').innerHTML = `<h2>Reports</h2><p>Syncing statistics...</p>`;
}
</script>
</body>
</html>
